<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightfall Interior Combat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--frame:#1b1c1e;--panel:rgba(24,24,26,.9);--line:#38393d;--text:#e2e0dc;--muted:#98968f;--gold:#e0a526;--red:#c23b2e;--blue:#2f9fc4;--body:'IBM Plex Sans Condensed',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--frame);color:var(--text);font:14px var(--body)}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
header h1{font:600 16px var(--body);margin:0 8px 0 0;letter-spacing:.02em}header h1 span{color:var(--gold)}
header label{color:var(--muted);font-size:12px;display:flex;gap:5px;align-items:center}
select,button{background:#2d2f33;border:1px solid var(--line);color:var(--text);font:600 13px var(--body);padding:5px 9px;border-radius:3px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--gold);color:#f3d38a}button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--gold);color:#211b10;border-color:var(--gold)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}#view{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 9px;font:12px var(--mono);max-width:min(330px,60%);z-index:2}
.hud b{font:600 14px var(--body);display:block}.hud .sub{color:var(--muted)}
.hover{position:absolute;right:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 9px;font:12px var(--mono);max-width:min(300px,45%);z-index:2}
.hover:empty{display:none}
.log{position:absolute;left:10px;bottom:10px;width:min(300px,40%);max-height:30%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font:11px/1.45 var(--mono);color:#c9c6bf;z-index:2}
.log p{margin:0}.log p:first-child{color:var(--text)}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--red);padding:8px 14px;border-radius:5px;text-align:center;max-width:min(520px,80%);z-index:3}
.banner,.hud,.hover{pointer-events:none}.banner button{pointer-events:auto}
.banner b{display:block;font:600 16px var(--body);margin-bottom:2px}.banner.ours{border-color:var(--gold)}
.bar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;max-width:min(760px,calc(100% - 330px));z-index:3}
.units,.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.acts{background:var(--panel);border-radius:5px;padding:5px}
.unit{background:var(--panel);border:1px solid var(--line);color:var(--text);font:12px var(--mono);padding:4px 7px;border-radius:4px;min-width:88px;text-align:left}
.unit[aria-pressed="true"]{border-color:var(--gold)}.unit.dead{opacity:.4}.unit.foe{border-color:#6e1a10}.unit.down{border-color:var(--red)}.unit em{font-style:normal;color:var(--muted)}.unit.flee{border-color:#9b4fc4}
.why{margin:4px 0 0;display:grid;grid-template-columns:1fr auto;gap:0 12px}.why .neg{color:#e2b0a8}.why .pos{color:#9fd3a8}.why b{border-top:1px solid var(--line);padding-top:2px}
.unit i{display:block;height:4px;background:#3a3b3f;margin-top:3px}.unit i s{display:block;height:100%}
.pop{position:absolute;left:0;top:0;font:700 15px var(--mono);color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;transform:translate(-50%,-100%);z-index:2}
.pop.miss{color:#d9d4c8}.pop.crit{color:#ffcf5a}.pop.info{color:#9fd3e6;font-size:13px}
.hint{color:var(--muted);font:12px var(--mono);padding:5px}
.ctx{position:absolute;z-index:5;min-width:190px;max-width:280px;background:rgba(24,24,26,.96);border:1px solid var(--line);border-radius:6px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.ctx h3{margin:2px 6px 4px;font:600 12px var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.ctx button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;margin:0;border:0;background:transparent;padding:6px 8px;border-radius:4px;font:600 13px var(--body)}
.ctx button:hover:not(:disabled),.ctx button:focus-visible{background:#2d2f33;outline:none}.ctx button span{font:12px var(--mono);color:#f3d38a}.ctx button:disabled span{color:var(--muted)}
.ctx p{margin:2px 8px 4px;font:11px var(--mono);color:var(--muted)}
.badge.plan{border-color:#4aa3ff;color:#cfe6ff}.badge.ghost{border-color:#6c6a66;color:#b9b6ae;background:rgba(24,24,26,.6)}.badge.over{border-color:#e2b0a8;color:#e2b0a8}
.unit small{display:block;font:11px var(--mono);color:#9fc6ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.badges{position:absolute;inset:0;pointer-events:none;z-index:2}.badge{position:absolute;transform:translate(-50%,-100%);font:600 12px var(--mono);background:rgba(24,24,26,.82);border:1px solid #6e1a10;color:#f1eee8;padding:1px 5px;border-radius:3px;white-space:nowrap}
.badge.zone{border-color:#3f6f8f;color:#cfe6ff;background:rgba(20,32,44,.78);font-weight:400;font-size:11px;transform:translate(-50%,-50%)}
.badge.flank{border-color:var(--gold);color:#f3d38a}.badge .arm{color:#9fd3e6}.badge.evac{border-color:#3fae7f;color:#9fd3a8}.badge.loot{border-color:var(--gold);color:#f3d38a}
#stage.fp .bar,#stage.fp .hud,#stage.fp .log,#stage.fp .banner,#stage.fp .badges,#stage.fp .hover,#stage.fp .pop{display:none}
.fps{position:absolute;inset:0;z-index:4;cursor:none}.fps-vig{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 38%,rgba(0,0,0,.55) 75%);pointer-events:none}
.fps-x{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);pointer-events:none}.fps-x i{position:absolute;background:#f3d38a;box-shadow:0 0 3px #000}
.fps-x i:nth-child(1){left:21px;top:0;width:2px;height:14px}.fps-x i:nth-child(2){left:21px;bottom:0;width:2px;height:14px}.fps-x i:nth-child(3){top:21px;left:0;height:2px;width:14px}.fps-x i:nth-child(4){top:21px;right:0;height:2px;width:14px}.fps-x b{position:absolute;left:20px;top:20px;width:4px;height:4px;border-radius:50%;background:#ff5a3a}
.fps-top{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);border-radius:5px;padding:5px 12px;font:12px var(--mono);text-align:center;min-width:240px}.fps-top b{display:block;font:600 14px var(--body)}
.fps-bar{display:block;height:4px;background:#3a3b3f;margin-top:4px}.fps-bar s{display:block;height:100%;background:var(--gold)}
.fps-help{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);margin:0;background:var(--panel);padding:4px 10px;border-radius:4px;font:12px var(--mono);color:var(--muted)}
.banner button{background:#2d2f33;border:1px solid var(--line);color:var(--text);font:600 13px var(--body);padding:5px 10px;margin:6px 3px 0;cursor:pointer;border-radius:3px}.banner button.pri{background:var(--gold);color:#211b10;border-color:var(--gold)}
/* decluttered: one header row with a View menu, a small bottom bar, a short log, pips over the soldiers */
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;background:#2d2f33;border:1px solid var(--line);padding:5px 9px;border-radius:3px;font:600 13px var(--body)}.menu summary::-webkit-details-marker{display:none}
.menu[open] summary{border-color:var(--gold);color:#f3d38a}.menu-body{position:absolute;right:0;top:calc(100% + 4px);z-index:10;display:flex;flex-direction:column;gap:4px;width:250px;background:rgba(24,24,26,.97);border:1px solid var(--line);border-radius:5px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.menu-body button{text-align:left}.menu-body p{margin:4px 2px 0;font:11px/1.45 var(--mono);color:var(--muted)}
.log{max-height:4.6em;opacity:.78;transition:max-height .2s,opacity .2s}.log:hover{max-height:40%;opacity:1}
.acts{padding:4px}.acts:empty{display:none}.acts button{padding:5px 12px}
.badge.pips{border:0;background:rgba(24,24,26,.55);padding:2px 3px;line-height:0}.badge.pips i{display:inline-block;width:5px;height:6px;margin:0 1px;background:#3fae7f;border-radius:1px}.badge.pips i.lost{background:#55575c}.badge.pips.hurt i{background:#e0a526}.badge.pips em{font:600 10px var(--mono);font-style:normal;color:#e2b0a8;line-height:1;margin-left:3px}.badge.pips.sel{outline:1px solid var(--gold)}
/* third person, free: crosshair and the key line */
.tp-x{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);pointer-events:none;z-index:3}.tp-x i{position:absolute;background:#f3d38a;box-shadow:0 0 2px #000}
.tp-x i:nth-child(1){left:14px;top:0;width:2px;height:9px}.tp-x i:nth-child(2){left:14px;bottom:0;width:2px;height:9px}.tp-x i:nth-child(3){top:14px;left:0;height:2px;width:9px}.tp-x i:nth-child(4){top:14px;right:0;height:2px;width:9px}
.tp-x b{position:absolute;left:13px;top:13px;width:4px;height:4px;border-radius:50%;background:#ff5a3a}.tp-x.steady{transform:translate(-50%,-50%) scale(.7)}
.tp-tip{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);z-index:3;max-width:min(760px,92%);text-align:center;font:12px/1.5 var(--mono);color:#cfcac0;pointer-events:none;text-shadow:0 1px 2px #000}
.tp-tip b{display:inline-block;background:#f3d38a;color:#211b10;padding:0 5px;border-radius:2px;margin-right:4px}.tp-tip span{opacity:.75}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:3px 0 0 3px}.seg button:last-child{border-radius:0 3px 3px 0}.seg[hidden]{display:none}
/* the squad up close: faces on the bar, a card for the selected soldier, what they say, the shot camera */
.unit .face{width:34px;height:34px;border-radius:3px;float:left;margin:0 6px 0 0;background:#34302b;object-fit:cover}.unit.dead .face{filter:grayscale(1) brightness(.6)}.unit.down .face{filter:sepia(.6) saturate(2) hue-rotate(-25deg)}
.hud .card{display:flex;gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}.hud .card img{width:62px;height:62px;border-radius:4px;background:#34302b}
.hud .card b{font:600 14px var(--body);display:block}.hud .card span{display:block;color:var(--muted)}.hud .card .hp i{display:inline-block;width:7px;height:9px;margin-right:2px;background:#3fae7f;border-radius:1px}.hud .card .hp i.lost{background:#3a3b3f}.hud .card .st{color:#e2b0a8}
.bark{position:absolute;left:0;top:0;transform:translate(-50%,-100%);max-width:200px;background:#f1eee8;color:#1d1814;font:600 13px var(--body);padding:4px 8px;border-radius:8px;pointer-events:none;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.bark b{display:block;font:600 10px var(--mono);color:#7a6a52;text-transform:uppercase;letter-spacing:.05em}.bark::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#f1eee8}
.bark.foe{background:#f3d9d3}.bark.foe::after{border-top-color:#f3d9d3}.bark.foe b{color:#8a2a1e}
#stage.cine .badges,#stage.cine .bar,#stage.cine .hover,#stage.cine .log{opacity:0;transition:opacity .2s}#stage.cine::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 70px 0 -30px rgba(0,0,0,.55),inset 0 -70px 0 -30px rgba(0,0,0,.55);z-index:2}
/* debug copy */
.dbg{position:absolute;right:10px;bottom:10px;max-height:calc(100% - 20px);overflow:auto;z-index:4;width:250px;background:rgba(20,32,44,.92);border:1px solid #3f6f8f;border-radius:5px;padding:7px 9px;font:12px var(--mono);color:#cfe6ff}
.dbg b{font:600 13px var(--body);color:#9fd3e6}.dbg label{display:block;margin:3px 0;cursor:pointer}.dbg .row{display:flex;gap:5px;margin-top:5px}.dbg .row button{flex:1;font-size:12px;padding:4px}.dbg p{margin:6px 0 0;color:#8fb3c9;font-size:11px}.dbg pre{margin:6px 0 0;white-space:pre-wrap;font-size:11px;color:#e2e0dc}
@media (max-width:760px){ .bar{left:8px;right:8px;transform:none;max-width:none;bottom:6px} .unit{min-width:0;padding:3px 6px;font-size:11px} .banner{top:auto;bottom:150px;max-width:calc(100% - 16px)} .hud{max-width:55%} .log{display:none} .hover{top:auto;bottom:120px;right:8px;max-width:60%} }
</style>
<div class="app">
<header>
  <h1>Nightfall <span>interior combat</span></h1>
  <label>Building <select id="bSel"></select></label>
  <label>Inside <select id="hSel"><option value="den">Raider den</option><option value="holdout">Holdout (hostile)</option></select></label>
  <button type="button" id="restartBtn">Restart</button>
  <div class="seg" id="viewSeg" hidden role="group" aria-label="Camera"><button type="button" data-v="tp" title="Over the shoulder of the selected soldier">Shoulder</button><button type="button" data-v="iso" aria-pressed="true">Isometric</button><button type="button" data-v="top">Top</button></div>
  <details class="menu" id="viewMenu"><summary>View ▾</summary><div class="menu-body">
    <button type="button" id="tpBtn" aria-pressed="false" title="Over the shoulder of the selected soldier: move with WASD and shoot with the mouse, in real time">Third person, free [V]</button>
    <button type="button" id="camBtn" aria-pressed="true" title="When someone fires, the camera goes over their shoulder; hovering an attack previews it">Action cam</button>
    <button type="button" id="sightBtn" aria-pressed="true" title="While concealed: the raiders' eyes">Raiders' sight</button>
    <button type="button" id="labelsBtn" aria-pressed="false" title="On the test range: what each part of the building tests">Test range labels</button>
    <button type="button" id="wallsBtn" title="Cutaway: walls facing the camera drop to knee height">Walls: cutaway</button>
    <button type="button" id="fpsBtn" aria-pressed="false" title="When one of your soldiers takes an overwatch shot, aim it yourself in first person">Aim overwatch yourself</button>
    <button type="button" id="rerollBtn" title="Same building, another procedural layout">Reroll layout</button>
    <button type="button" id="rosterBtn" title="Start a fresh squad: ranks and the memorial are kept in this browser">New squad</button>
    <p>Click a soldier to select them (Tab: next). Left click: move. Right click a raider, a thing or the soldier: what to do. Space: Go. WASD, Q/E: camera.</p>
  </div></details>
</header>
<div id="stage">
  <canvas id="view"></canvas>
  <div class="hud" id="hud"></div>
  <div class="hover" id="hover"></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="banner" id="banner" hidden></div>
  <div class="badges" id="badges" aria-hidden="true"></div>
  <div class="fps" id="fps" hidden><div class="fps-vig"></div><div class="fps-x" id="fpsX"><i></i><i></i><i></i><i></i><b></b></div><div class="fps-top"><b id="fpsWho"></b><span id="fpsInfo"></span><i class="fps-bar"><s id="fpsBar"></s></i></div><p class="fps-help">Overwatch: aim with the mouse, click to fire · Esc lets the roll decide</p></div>
  <div class="ctx" id="ctx" hidden role="menu"></div>
  <div class="bar" id="bar"><div class="acts" id="acts"></div></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>const FigureKit=(()=>{
const TAU=Math.PI*2; const ui={shade:'toon'};
const SKINS=['#f3dfb0','#efd3a8','#e6c39a','#d8ab80','#c18e64','#a87550','#8a5a3c','#6a4330'];
const HAIRS=['#1f1813','#2e2119','#4a3020','#6a4a2e','#8a6a40','#b08a52','#7a3c22','#5c5650'];
const EYES=['#4a3524','#2f2a26','#4c6a7a','#566640','#6a4a2a','#3a4a58'];
// every face is generated from a seed: proportions, features, colouring and haircut
function rng(seed){ let x=seed>>>0; x^=x>>>16; x=Math.imul(x,0x7feb352d); x^=x>>>15; x=Math.imul(x,0x846ca68b); x^=x>>>16; x=x>>>0||1; return ()=>{ x=(Math.imul(x,1664525)+1013904223)>>>0; return x/4294967296; }; }
// Heritage profiles: broad population tendencies that nudge the individual draw. Ranges overlap heavily, individual
// variation stays larger than the nudge, and about a third of people blend two profiles.
const HERITAGE={
  westAfrican:   {label:'West African',    skin:[5,7], eyes:[0,1],       hair:[0,1],   d:{noseW:.26,noseL:-.06,noseT:-.12,noseS:.04,lipU:.0016,lipL:.0018,eyeOpen:.05,eyeS:.04}},
  eastAsian:     {label:'East Asian',      skin:[0,3], eyes:[0,1],       hair:[0,1],   d:{noseW:.02,noseL:-.08,noseT:-.24,noseS:-.06,eyeOpen:-.3,fold:.9,tilt:.07,socket:-.004,brow:-.003,cheek:.002,w:.03,eyeS:-.05}},
  southAsian:    {label:'South Asian',     skin:[3,6], eyes:[0,1,4],     hair:[0,1,2], d:{noseL:.03,noseW:.06,eyeOpen:.06,eyeS:.05,lipL:.0006}},
  european:      {label:'European',        skin:[0,2], eyes:[0,1,2,3,4,5], hair:[1,2,3,4,5,6,7], d:{noseL:.05,noseT:.1,noseW:-.08,socket:.002,brow:.001}},
  middleEastern: {label:'Middle Eastern',  skin:[2,4], eyes:[0,1,4,3],   hair:[0,1,2], d:{noseL:.07,noseT:.14,noseS:.05,hump:.35,brow:.001,browT:.12}},
  indigenous:    {label:'Indigenous American', skin:[3,5], eyes:[0,1],   hair:[0,1],   d:{noseT:.06,noseL:.02,cheek:.003,eyeOpen:-.12,fold:.4,w:.03}},
};
const HKEYS=Object.keys(HERITAGE);
function genFace(seed,fem){
  const r=rng(seed*2654435761), R=(a,b)=>a+(b-a)*r(), pick=a=>a[Math.floor(r()*a.length)], k=fem?.6:1;
  // heritage: one profile, sometimes blended with a second
  const h1=pick(HKEYS), mixed=r()<.33; let h2=pick(HKEYS); if(h2===h1) h2=HKEYS[(HKEYS.indexOf(h1)+1)%HKEYS.length];
  const wt=mixed?R(.25,.5):0, H1=HERITAGE[h1], H2=HERITAGE[h2], D=k2=>(H1.d[k2]||0)*(1-wt)+(H2.d[k2]||0)*wt;
  const P={fem, heritage:mixed?`${H1.label} / ${H2.label}`:H1.label,
    w:R(.88,1.12)+D('w'), d:R(.94,1.07), len:R(.92,1.08), jaw:R(.8,1.2)*(fem?.93:1), chinFwd:R(-.01,.01), chin:R(.002,.011)*k,
    brow:Math.max(.0005,R(.002,.011)*k+D('brow')), cheek:R(.002,.011)+D('cheek'), cheekY:R(.09,.106), eyeY:R(.11,.126), eyeA:R(16,22.5), socket:Math.max(.003,R(.006,.014)+D('socket')),
    noseL:R(.84,1.14)+D('noseL'), noseW:R(.78,1.3)+D('noseW'), noseT:R(.75,1.3)+D('noseT'), noseS:R(.86,1.14)+D('noseS'), hump:r()<.2+D('hump'),
    lipU:R(.002,.0045)+(fem?.0015:0)+D('lipU'), lipL:R(.0028,.005)+(fem?.0015:0)+D('lipL'),
    mouthW:R(.9,1.15), browT:R(.8,1.25)*(fem?.8:1)+D('browT'), browArch:R(-.004,.006)+(fem?.003:0),
    eyeS:R(.82,1.2)+D('eyeS'), eyeOpen:Math.max(.5,R(.85,1.15)+D('eyeOpen')), fold:Math.min(1,Math.max(0,R(-.15,.15)+D('fold'))), tilt:R(-.03,.05)+D('tilt'),
    forehead:R(-.008,.006), ear:R(.85,1.15)};
  // colouring from the blended profile: skin index range, then eye and brow colour from the main profile
  const lo=H1.skin[0]*(1-wt)+H2.skin[0]*wt, hi=H1.skin[1]*(1-wt)+H2.skin[1]*wt, tone=Math.max(0,Math.min(SKINS.length-1,Math.round(R(lo-.4,hi+.4))));
  P.skin=SKINS[tone]; P.eye=EYES[pick(r()<wt?H2.eyes:H1.eyes)]; P.hair=HAIRS[pick(r()<wt?H2.hair:H1.hair)];
  const hs=r(); P.style=fem?(hs<.45?'bob':hs<.8?'bun':'crop'):(hs<.45?'crop':hs<.8?'buzz':'quiff');
  // body: a second random stream from the same seed
  const b=rng(seed*97+13), B=(a,c)=>a+(c-a)*b();
  P.body={head:B(.93,1.07), neck:B(.8,1.3), shoulders:fem?B(.88,1.06):B(.9,1.15), torso:B(.94,1.06), waist:B(.88,1.15), hips:fem?B(1,1.12):B(.92,1.06),

<script>// ---------- Motion: procedural movement for FigureKit figures ----------

//   1. traits fixed per person by seed: stride, arm swing, posture, bounce, how they stand;
//   2. every time an action starts, its joint angles are rolled inside per-joint bounds;
//   3. smooth noise keeps held poses alive; wounds and panic widen and speed it up.
// On top of the pose:
//   - feet are anchored in the world while they bear weight and step when they must (walking, turning, changing stance);
//     hips, knees and ankles are solved to put each foot flat on its own ground;
//   - a held weapon (Motion.arm: a bolt-action rifle or a pistol) is placed by its hold, and the hands are solved to it;

      for(let L=0;L<9&&!made;L++) for(const r of urooms){ if(conn.has(r.id)) continue; const pref=LINK[r.kind]||[]; for(const n of nb(r.id)){ if(conn.has(n)&&pref.indexOf(byId[n].kind)===L){ link(r.id,n); conn.add(r.id); made=true; break; } } if(made) break; }
      if(!made) for(const r of urooms){ if(conn.has(r.id)) continue; const n=nb(r.id).find(x=>conn.has(x)); if(n!==undefined){ link(r.id,n); conn.add(r.id); made=true; break; } }
      if(!made){ for(const r of urooms) if(!conn.has(r.id)){ isolated.push(r); conn.add(r.id); } }
    }
    const shop=typeKey!=='house';
    let front=null;
    if(!upper) for(const kind of T.front){
      const cands=urooms.filter(r=>r.kind===kind).flatMap(r=>roomRuns(r.id)).filter(r=>dot(r[0].dir,f)>.45&&r.length>=(shop?4:3)).sort((a,b)=>(dot(b[0].dir,f)*3+b.length*.05)-(dot(a[0].dir,f)*3+a.length*.05));
      for(const run of cands){ front=putExt(run,shop?2:1,'door','front'); if(front) break; }
      if(front) break;
    }
    if(!front&&!upper&&!Un.inner){ const all=urooms.flatMap(r=>roomRuns(r.id)).sort((a,b)=>dot(b[0].dir,f)-dot(a[0].dir,f)); for(const run of all){ front=putExt(run,1,'door','front'); if(front) break; } }
    if(front){ front.unit=uk; fronts.push(front); }
    // garage doors on the drive side; service bays open to the street
    for(const gar of upper?[]:urooms.filter(r=>r.kind==='garage'||r.kind==='bay')){
      const bay=gar.kind==='bay', dv=bay?f:sense.drive, cars=gar.cars||1;
      const runs=roomRuns(gar.id).sort((a,b)=>dot(b[0].dir,dv)+b.length*.02-dot(a[0].dir,dv)-a.length*.02);
      for(const run of runs){ const w=Math.min(bay?4:cars===2?5:3,run.length-1); if(w<2) continue; if(putExt(run,w,'gdoor','garage')) break; }
    }
    let back=null;
    if(!upper) for(const kind of T.back){
      const cands=urooms.filter(r=>r.kind===kind).flatMap(r=>roomRuns(r.id)).filter(r=>dot(r[0].dir,f)<-.4).sort((a,b)=>dot(a[0].dir,f)-dot(b[0].dir,f));
      for(const run of cands){ back=putExt(run,1,'door','back'); if(back) break; }
      if(back) break;
    }
    if(!back&&!upper&&!Un.inner){ for(const kind of T.back){ const cands=urooms.filter(r=>r.kind===kind).flatMap(r=>roomRuns(r.id)).filter(r=>dot(r[0].dir,f)<.3); for(const run of cands){ back=putExt(run,1,'door','back'); if(back) break; } if(back) break; } }
    if(back){ back.unit=uk; backs.push(back); }
    // a big room with one way in gets a second, so no fight is a dead end
    const doorCount=id=>doors.filter(e=>e.a===id||e.b===id).length+[...edges.values()].filter(e=>e.type==='open'&&(e.a===id||e.b===id)).length;
    for(const r of urooms){ if(r.cells.length<30||/bath|restroom|walkin|vault|server|stair|elev|storage|corridor/.test(r.kind)||doorCount(r.id)>1) continue;
      const nbs=nb(r.id).filter(n=>!/bath|restroom|walkin|vault|server|stair|elev/.test(byId[n].kind)&&!doors.some(e=>(e.a===r.id&&e.b===n)||(e.a===n&&e.b===r.id))).sort((a,b)=>byId[b].cells.length-byId[a].cells.length);
      if(nbs.length) link(r.id,nbs[0]); }
    if(!upper&&!Un.inner) for(const r of isolated) for(const run of roomRuns(r.id)){ if(putExt(run,1,'door','side')) break; }
    // windows
    const nearDoor=new Set();
    for(const d of extDoors) for(const e of d.edges){ const o=e.key[0], [p,q]=e.key.slice(1).split(',').map(Number); for(const s2 of [-1,1]) nearDoor.add(o==='v'?o+p+','+(q+s2):o+(p+s2)+','+q); }
    for(const r of urooms){
      const rule=(typeKey!=='house'&&r.kind==='dining')?null:WIN[r.kind]; if(!rule) continue;
      const runs=roomRuns(r.id).sort((a,b)=>dot(b[0].dir,f)+b.length*.03-dot(a[0].dir,f)-a.length*.03);
      if(rule.storefront){
        for(const run of runs){ if(dot(run[0].dir,f)<.45) continue; for(let k=1;k<run.length-1;k++){ const e=run[k]; if(e.type==='wall') win(e,rule,{store:true}); } }
        continue;
      }
      if(rule.bays){
        for(const run of runs){ if(dot(run[0].dir,f)<-.4) continue; for(let k=1;k+1<run.length-1;k+=3){ for(const e of [run[k],run[k+1]]) if(e.type==='wall'&&!nearDoor.has(e.key)) win(e,rule); } }
        continue;
      }
      let placed=0;
      for(const run of runs){
        if(placed>=rule.n) break;
        const n=run.length; if(n<3) continue;
        const w=Math.min(pick(rng,rule.w),n-2);
        const usable=k=>{ for(let q=0;q<w;q++){ const e=run[k+q]; if(!e||e.type!=='wall'||nearDoor.has(e.key)) return false; } return true; };
        const ks=[]; for(let k=1;k+w<=n-1;k++) if(usable(k)) ks.push(k);
        if(!ks.length) continue;
        const k=ks.reduce((a,b)=>Math.abs(a+w/2-n/2)<=Math.abs(b+w/2-n/2)?a:b);
        for(let q=0;q<w;q++) win(run[k+q],rule);
        placed++;
        if(n>=9&&placed<rule.n&&rule.n>1){ const k2=ks.find(x=>x>=k+w+2); if(k2!==undefined&&k2+w<=n-1){ for(let q=0;q<w;q++) win(run[k2+q],rule); placed++; } }
      }
    }
  });
  return {edges,doors,extDoors,windows,front:fronts[0]||null,back:backs[0]||null,fronts,backs,hub:hubAll};
}

  for(const room of rooms){ const lim=BUDGET[room.kind]||.28, mine=items.filter(it=>it.room===room.id&&!it.dropped);

    for(const key of DROP){ if(used<=lim*room.cells.length) break; for(const it of mine.filter(x=>x.key===key&&!x.dropped).reverse()){ if(used<=lim*room.cells.length) break; it.dropped=true; for(const c of it.cells) if(occ[c]===it.id){ occ[c]=-1; reserved[c]=0; } used-=it.spec.cover!=='none'?it.cells.length:0; } } }
  const kept=items.filter(it=>!it.dropped); occ.fill(-1); kept.forEach((it,k)=>{ it.id=k; for(const c of it.cells) occ[c]=k; });
  items.length=0; items.push(...kept);
  return {items,occ,reserved,keep,doorCells};
}

// ---------------------------------------------------------------- history and decay (own seed stream, never moves a wall)
function decay(M,P,O,Fn,rng,history){
  const {W}=M, {rooms,roomOf}=P, {items,occ,keep}=Fn;
  const people=[], extra=[];
  const ext=O.extDoors;
  for(const d of ext){ for(const e of d.edges){ e.door.state='closed'; e.door.open=false; } }
  for(const w of O.windows) w.win.state='intact';
  const containers=items.filter(it=>it.spec.slot);
  for(const it of containers) it.searched=false;
  const freeCells=(room)=>/stair|elev/.test(room.kind)?[]:room.cells.filter(c=>occ[c]<0&&!keep[c]);
  function addItem(room,key,c,f){
    const spec=IT[key]; const i=c%W,j=(c/W)|0;
    if(occ[c]>=0) return null;
    const id=items.length; const it={id,key,spec,room:room.id,cells:[c],f:f||0,access:[c],i,j,added:true};
    items.push(it); occ[c]=id; return it;
  }
  const biggest=(kinds)=>rooms.filter(r=>kinds.includes(r.kind)).sort((a,b)=>b.cells.length-a.cells.length)[0]||rooms.slice().sort((a,b)=>b.cells.length-a.cells.length)[0];
  if(history==='looted'||history==='den'){
    const kicked=O.front||O.back; if(kicked){ for(const e of kicked.edges){ e.door.state=e.type==='gdoor'?'open':'broken'; e.door.open=true; } }
    for(const d of ext) if(d!==kicked&&rng()<.5) for(const e of d.edges){ e.door.open=true; e.door.state='open'; }
    for(const w of O.windows) if(rng()<(history==='den'?.5:.3)) w.win.state='broken'; else if(history==='den'&&rng()<.3) w.win.state='boarded';
    for(const it of containers) if(rng()<(history==='den'?.55:.8)) it.searched=true;
    for(const e of O.doors) if(!e.ext&&e.door){ if(rng()<.7) e.door.open=true; if(rng()<.12) e.door.state='broken'; }
    for(const r of rooms){ const fc=freeCells(r); const n=Math.round(fc.length*(history==='den'?.03:.02)); for(let k=0;k<n&&fc.length;k++){ const c=fc.splice(Math.floor(rng()*fc.length),1)[0]; addItem(r,'debris',c); } }
  }
  if(history==='holdout'){
    for(const w of O.windows) w.win.state='boarded';
    if(O.front){ for(const e of O.front.edges){ e.door.state='barricaded'; }
      // move furniture against the front door from inside
      const e=O.front.edges[0]; const c=e.i+e.j*W; const r=rooms.find(x=>x.id===roomOf[c]);
      for(const fe of O.front.edges){ const fc=fe.i+fe.j*W; const ff=(fe.dir+2)%4; keep[fc]=0; addItem(r,'barricade',fc,ff); }
    }
    for(const d of ext) if(d.role==='garage') for(const e of d.edges) e.door.state='barricaded';
  }
  if(history==='holdout'||history==='den'){
    const camp=biggest(history==='den'?['living','rdining','sales','ffdining','cafe','lobby','openoffice','waiting','salon','bay']:['living','den','master','sales','rdining','ffdining','cafe','openoffice','lobby','waiting','salon']);
    const fc=freeCells(camp).filter(c=>!Fn.reserved[c]);
    const nBed=history==='den'?rint(rng,3,5):rint(rng,2,4);
    for(let k=0;k<nBed&&fc.length;k++){ const c=fc.splice(Math.floor(rng()*fc.length),1)[0]; addItem(camp,'bedroll',c,rint(rng,0,3)); }
    if(history==='den'&&fc.length){ const c=fc.splice(Math.floor(fc.length/2),1)[0]; addItem(camp,'barrel',c); }
    const store=biggest(history==='den'?['garage','bay','stock','storage','rkitchen','ffkitchen','kitchen']:['kitchen','stock','storage','rkitchen','ffkitchen','cafeback','breakroom','den']);
    const sc=freeCells(store).filter(c=>!Fn.reserved[c]);
    for(let k=0;k<rint(rng,2,4)&&sc.length;k++){ const c=sc.splice(Math.floor(rng()*sc.length),1)[0]; const it=addItem(store,'crate',c); if(it){ it.stash=true; it.searched=false; } }
    const n=history==='den'?rint(rng,3,5):rint(rng,2,4);
    const all=rooms.flatMap(r=>freeCells(r).filter(c=>!Fn.reserved[c]).map(c=>[r,c]));
    for(let k=0;k<n&&all.length;k++){ const [r,c]=all.splice(Math.floor(rng()*all.length),1)[0]; people.push({c,side:history==='den'?'raider':'survivor',boss:history==='den'&&k===0}); }
  }
  return {people};
}

// ---------------------------------------------------------------- loot: the site's amount, shared over its containers
function stockLoot(site,unitsAll,P,Fn,rng,history){
  const factor={untouched:1,looted:.25,holdout:1.4,den:.6}[history];
  const rmap={}; for(const r of P.rooms) rmap[r.id]=r;
  let unitsSum=0, baseSum=0;
  for(const it of Fn.items) if(it.spec.slot) it.contents=[];
  unitsAll.forEach((Un,uk)=>{
  const typeKey=Un.typeKey, T=TYPES[typeKey], A=Un.cells.length;
  const base=Math.round(T.units*Math.pow(A/200,.6));
  const units=Math.max(1,Math.round(base*factor)); unitsSum+=units; baseSum+=base;
  const rk=id=>rmap[id].kind;
  const conts=Fn.items.filter(it=>it.spec.slot&&rmap[it.room]&&rmap[it.room].unit===uk);
  const open=conts.filter(it=>!it.searched);
  const mixFor=it=>{
    const sl=SLOTS[it.spec.slot]; let cats=sl.cats;
    if(!cats){
      const k=rk(it.room);
      if(k==='walkin') cats={food:4,water:2};
      else if(k==='dispensary') cats={medicine:6,goods:.5};
      else if(k==='garage'||k==='bay') cats={tools:2,fuel:2};
      else cats=Object.assign({},T.mix);
      if(it.stash) cats=history==='den'?{gear:2,food:2,fuel:1,medicine:1}:{food:3,water:3,medicine:1};
    }
    cats=Object.assign({},cats);
    if(typeKey==='clinic'&&/cabinet|sink|vanity|desk/.test(it.spec.slot)) cats={medicine:5,goods:1};
    if(Un.loot&&cats[Un.loot]!==undefined&&!sl.cats) cats[Un.loot]+=1;
    return cats;
  };
  const caps=open.map(it=>SLOTS[it.spec.slot].cap*(.5+rng()));
  const load=open.map(()=>0);
  for(let u=0;u<units&&open.length;u++){
    let tot=0; for(let k=0;k<open.length;k++) if(load[k]<SLOTS[open[k].spec.slot].cap*2) tot+=caps[k];
    if(tot<=0) break;
    let x=rng()*tot, k=0; for(;k<open.length;k++){ if(load[k]>=SLOTS[open[k].spec.slot].cap*2) continue; x-=caps[k]; if(x<=0) break; }
    k=Math.min(k,open.length-1); load[k]++;
    const cats=mixFor(open[k]); let ct=0; for(const c in cats) ct+=cats[c]; let y=rng()*ct, cat='goods'; for(const c in cats){ y-=cats[c]; if(y<=0){cat=c;break;} }
    const extra=(POOL_EXTRA[typeKey]||{})[cat]||[]; const pool=POOL[cat].concat(extra,extra);
    const name=pick(rng,pool);
    const have=open[k].contents.find(x=>x.name===name); if(have) have.qty++; else open[k].contents.push({name,cat,qty:1});
  }
  });
  return {units:unitsSum,base:baseSum};
}

// ---------------------------------------------------------------- wall build-ups
// What each wall is made of decides how it breaks. t is half the thickness. pierce: how much of a round's push the
// wall soaks up (null stops it). hand: blows of a sledge to open a hole, then a breach (null: too thick).
// charges: breaching charges to open it. Thin and thick are what the squad sees; the numbers stay with combat.
const WALLMAT={
  stud:  {n:'Drywall partition',     cls:'thin',   t:.06, pierce:1,    hand:[1,2], charges:1, gren:[1.0,1.9,3.0], core:'#e8e2d4', studs:'#b08a5a'},
  frame: {n:'Stucco over wood frame',cls:'medium', t:.12, pierce:2,    hand:[2,3], charges:1, gren:[.45,1.0,2.2], core:'#cbb79a', studs:'#9c7a52'},
  block: {n:'Concrete block',        cls:'thick',  t:.15, pierce:null, hand:null,  charges:1, gren:[0,0,1.2],   core:'#9a958c'},
  vault: {n:'Reinforced concrete',   cls:'very thick', t:.2, pierce:null, hand:null, charges:2, gren:[0,0,.6],  core:'#8d8b86'},
};
// Outside walls: ranch houses here are stucco over frame or painted block; shops, banks and offices are block,
// office storeys above the ground floor are framed. Inside: drywall, except block round the stair and lift shafts,
// block between shops in a strip, and concrete round a vault.
function assignWallMats(P,O,units,seedStr,fk){
  const byId=new Map(P.rooms.map(r=>[r.id,r])), q=rngOf(seedStr+'|walls');
  const house=q()<(seedStr.startsWith('newriver')?.55:.25)?'block':'frame';
  const extFor=r=>{ const t=r?r.unitType:'house'; if(t==='house') return house; if(t==='canopy') return 'frame'; if(fk>0&&/office|suite|clinic|vacant|common/.test(t)) return 'frame'; return 'block'; };
  const strip=units.length>1&&!units.some(u=>/common|suite|vacant/.test(u.typeKey));
  for(const e of O.edges.values()){
    const a=byId.get(e.a), b=e.b>=0?byId.get(e.b):null; let m;
    if(e.ext) m=extFor(a);
    else if((a&&a.kind==='vault')||(b&&b.kind==='vault')) m='vault';
    else if((a&&/stair|elev/.test(a.kind))||(b&&/stair|elev/.test(b.kind))) m='block';
    else if(strip&&a&&b&&a.unit!==b.unit) m='block';
    else m='stud';
    e.mat=m; e.th=e.ext?WALLMAT[m].t:{stud:.06,frame:.08,block:.1,vault:.15}[m]; // 8 in block between rooms, 12 in outside
  }
}

// ---------------------------------------------------------------- whole generation
// Multi-tenant offices (Anthem's are 2-storey Class B blocks of 110-650 m² suites): a 2-3 m corridor along the
// middle of every wing, found as the ridge of the distance from the outside walls, joined to the cores and to an
// entrance on the street side and an exit at the back. What is left becomes suites, each touching the corridor.
function officeSuites(M,cores,sense,rng,fk){
  const {W,H,mask}=M, N=W*H, core=new Set(cores.flatMap(c=>c.cells));
  const dist=new Int32Array(N).fill(0), q=[];
  for(let c=0;c<N;c++) if(mask[c]){ const i=c%W,j=(c/W)|0; for(const [di,dj] of DIRS) if(!mask[(j+dj)*W+i+di]){ dist[c]=1; q.push(c); break; } }
  for(let h=0;h<q.length;h++){ const c=q[h], i=c%W,j=(c/W)|0; for(const [di,dj] of DIRS){ const n=(j+dj)*W+i+di; if(mask[n]&&!dist[n]){ dist[n]=dist[c]+1; q.push(n); } } }
  // centre lines of the footprint by thinning (Zhang-Suen), spurs trimmed, then 2 m wide
  const m=Uint8Array.from(mask); let changed=true;
  while(changed){ changed=false; for(const step of [0,1]){ const del=[];
    for(let j=1;j<H-1;j++) for(let i=1;i<W-1;i++){ const c=j*W+i; if(!m[c]) continue;
      const n=[m[c-W],m[c-W+1],m[c+1],m[c+W+1],m[c+W],m[c+W-1],m[c-1],m[c-W-1]], B=n.reduce((x,y)=>x+y,0); if(B<2||B>6) continue;
      let A=0; for(let k=0;k<8;k++) if(!n[k]&&n[(k+1)%8]) A++; if(A!==1) continue;
      if(step===0?(n[0]&&n[2]&&n[4])||(n[2]&&n[4]&&n[6]):(n[0]&&n[2]&&n[6])||(n[0]&&n[4]&&n[6])) continue; del.push(c); }
    for(const c of del) m[c]=0; if(del.length) changed=true; } }
  let cor=new Set(); for(let c=0;c<N;c++) if(m[c]&&dist[c]>=3&&!core.has(c)) cor.add(c);
  let pending=[];
  const n8=c=>{ let k=0; for(const d of [-W-1,-W,-W+1,-1,1,W-1,W,W+1]) if(cor.has(c+d)) k++; return k; };
  for(let it=0;it<6;it++) for(const c of [...cor]) if(n8(c)<=1) cor.delete(c);
  { const comp8=s0=>{ const seen=new Set([s0]), st=[s0]; while(st.length){ const c=st.pop(); for(const d of [-W-1,-W,-W+1,-1,1,W-1,W,W+1]){ const n=c+d; if(cor.has(n)&&!seen.has(n)){ seen.add(n); st.push(n); } } } return seen; };
    const comps=[], seenC=new Set(); for(const c of cor){ if(seenC.has(c)) continue; const k=comp8(c); for(const x of k) seenC.add(x); if(k.size>=10) comps.push(k); }
    comps.sort((a,b)=>b.size-a.size); cor=new Set(comps[0]||[]); pending=comps.slice(1); }
  for(const c of [...cor]) for(const d of [1,W,W+1]) if(mask[c+d]&&!core.has(c+d)) cor.add(c+d);
  // carve 2 m paths: corridor to every core, to a street entrance and to a back exit
  const carve=(from,isGoal)=>{ const prev=new Map(), st=[...from]; for(const c of st) prev.set(c,-1);

// A rifle round fired level along the view, at the height clicked. Each wall it meets soaks up part of its push;

let tracer=null;
function shoot(h){

// A sledgehammer. Thin and medium walls open a blow at a time; block and concrete only chip.

// A breaching charge set against the wall. Block needs one; reinforced concrete needs two. The blast also throws

// ---------------------------------------------------------------- moving props by hand
// Squad members can drag a prop (or one thrown piece of it) clear. Click it, then click the floor where it goes,

let MOVE=null;
const movable=it=>FLIP_PROPS.has(it.key)||!!REC.moved[G.level+':'+it.id];

  for(const pt of parts){ const pc=(pt[7]&&pt[7].piece)||'m'; (gp[pc]=gp[pc]||[]).push(pt); }
  for(const pc in gp){ const Mx=mv&&mv.m&&mv.m[pc]?new THREE.Matrix4().fromArray(mv.m[pc]):it.L0.clone(); const Bq=new Batch(); emitTo(Bq,gp[pc],Mx); if(!Bq.p.length) continue; out[pc]={M:Mx,box:boundsOf(Bq)}; }

}
function doorwayCells(){ // the cells either side of every doorway and breach
  const S=new Set(), M=G.M, W=M.W;
  for(const e of G.O.edges.values()){ const dm=REC.walls[G.level+':'+e.key]; if(!(e.type==='door'||e.type==='gdoor'||(dm&&dm.s>=3))) continue;
    S.add(e.j*W+e.i); const n=(e.j+DIRS[e.dir][1])*W+e.i+DIRS[e.dir][0]; if(M.mask[n]) S.add(n); }

  const M=G.M, S=new Set(); for(const b of boxes){ if(tall&&b[4]-FY<.45) continue;
    for(let j=Math.floor(b[2]+.05-M.v0);j<=Math.floor(b[5]-.05-M.v0);j++) for(let i=Math.floor(b[0]+.05-M.u0);i<=Math.floor(b[3]-.05-M.u0);i++) S.add(j*M.W+i); }

function shove(it,pc,instant){ // to the nearest clear spot in the room, off every doorway, against a wall if it can

// Overturning is scripted, not simulated: the same click always gives the same result. The prop tips away

function overturn(it){

  SIM=true; const t0=performance.now(), dur=.55;

<script>// ---------- combat rules: plain functions over plain data ----------

function makeUnit(role,o){ o=o||{}; const R=ROLES[role], W=WEAPONS[R.weapon], rank=o.rank||0, hp=R.hp+rank;

<script>// ---------- the roof: a second level to fight on ----------

// (the building's footprint, edged by the outside walls as a parapet; holes are blocked, like furniture), so the
// same field, routes and snapping work up there. Sight between levels is decided here:
//   roof ↔ outside ground  over the edge, only from within EDGE m of it (you have to look over);
//   roof ↔ inside          only through a hole, from its rim, down to targets within DOWN m of the hole;
//   roof ↔ roof            the roof space's own sight.
// Holes come from a Breacher's charge set on the roof. Ladders on outside walls join the levels.
const RoofDeck=(()=>{

  const exts=[...G.O.edges.values()].filter(e=>e.ext).map(e=>({key:e.key,type:'wall',a:0,b:-1,dir:e.dir,i:e.i,j:e.j,ext:true,mat:'block',th:.15}));

    const items=holes.map((h,k)=>({id:k,key:'hole',cells:h.cells,f:0,i:0,j:0,spec:{h:1,cover:'none',w:1,d:1}}));
    const GR={site:{walls:[],roads:[]},M,O:{edges:new Map(exts.map(e=>[e.key,e])),extDoors:[],front:null},Fn:{items},D:{people:[]},level:0,seedStr:'roof'};
