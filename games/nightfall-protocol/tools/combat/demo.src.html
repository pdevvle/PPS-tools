<title>Nightfall Interior Combat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--frame:#1b1c1e;--panel:rgba(24,24,26,.9);--line:#38393d;--text:#e2e0dc;--muted:#98968f;--gold:#e0a526;--red:#c23b2e;--blue:#2f9fc4;--body:'IBM Plex Sans Condensed',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--frame);color:var(--text);font:14px var(--body)}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
header h1{font:600 16px var(--body);margin:0 8px 0 0;letter-spacing:.02em}header h1 span{color:var(--gold)}
header label{color:var(--muted);font-size:12px;display:flex;gap:5px;align-items:center}
select,button{background:#2d2f33;border:1px solid var(--line);color:var(--text);font:600 13px var(--body);padding:5px 9px;border-radius:3px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--gold);color:#f3d38a}button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--gold);color:#211b10;border-color:var(--gold)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}#view{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 9px;font:12px var(--mono);max-width:min(330px,60%);z-index:2}
.hud b{font:600 14px var(--body);display:block}.hud .sub{color:var(--muted)}
.hover{position:absolute;right:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 9px;font:12px var(--mono);max-width:min(300px,45%);z-index:2}
.hover:empty{display:none}
.log{position:absolute;left:10px;bottom:10px;width:min(300px,40%);max-height:30%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font:11px/1.45 var(--mono);color:#c9c6bf;z-index:2}
.log p{margin:0}.log p:first-child{color:var(--text)}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--red);padding:8px 14px;border-radius:5px;text-align:center;max-width:min(520px,80%);z-index:3}
.banner b{display:block;font:600 16px var(--body);margin-bottom:2px}.banner.ours{border-color:var(--gold)}
.bar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;max-width:min(760px,calc(100% - 330px));z-index:3}
.units,.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.acts{background:var(--panel);border-radius:5px;padding:5px}
.unit{background:var(--panel);border:1px solid var(--line);color:var(--text);font:12px var(--mono);padding:4px 7px;border-radius:4px;min-width:88px;text-align:left}
.unit[aria-pressed="true"]{border-color:var(--gold)}.unit.dead{opacity:.4}.unit.foe{border-color:#6e1a10}.unit.down{border-color:var(--red)}.unit em{font-style:normal;color:var(--muted)}.unit.flee{border-color:#9b4fc4}
.why{margin:4px 0 0;display:grid;grid-template-columns:1fr auto;gap:0 12px}.why .neg{color:#e2b0a8}.why .pos{color:#9fd3a8}.why b{border-top:1px solid var(--line);padding-top:2px}
.unit i{display:block;height:4px;background:#3a3b3f;margin-top:3px}.unit i s{display:block;height:100%}
.pop{position:absolute;left:0;top:0;font:700 15px var(--mono);color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;transform:translate(-50%,-100%);z-index:2}
.pop.miss{color:#d9d4c8}.pop.crit{color:#ffcf5a}.pop.info{color:#9fd3e6;font-size:13px}
.hint{color:var(--muted);font:12px var(--mono);padding:5px}
@media (max-width:760px){ .bar{left:8px;right:8px;transform:none;max-width:none;bottom:6px} .unit{min-width:0;padding:3px 6px;font-size:11px} .banner{top:auto;bottom:150px;max-width:calc(100% - 16px)} .hud{max-width:55%} .log{display:none} .hover{top:auto;bottom:120px;right:8px;max-width:60%} }
</style>
<div class="app">
<header>
  <h1>Nightfall <span>interior combat</span></h1>
  <label>Building <select id="bSel"></select></label>
  <label>Inside <select id="hSel"><option value="den">Raider den</option><option value="holdout">Holdout (hostile)</option></select></label>
  <button type="button" id="rerollBtn" title="Same building, another procedural layout">Reroll layout</button>
  <button type="button" id="restartBtn">Restart</button>
  <button type="button" id="sightBtn" aria-pressed="true" title="Show what is seen: the raiders' eyes while you are concealed, your selected soldier's sight in a fight">Sight</button>
  <button type="button" id="wallsBtn" title="Cutaway: walls facing the camera drop to knee height">Walls: cutaway</button>
</header>
<div id="stage">
  <canvas id="view"></canvas>
  <div class="hud" id="hud"></div>
  <div class="hover" id="hover"></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="banner" id="banner" hidden></div>
  <div class="bar" id="bar"><div class="units" id="units"></div><div class="acts" id="acts"></div></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
