<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}QB Categorizer{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --fg: #1a1a1a;
      --muted: #666;
      --bg: #fafaf8;
      --card: #fff;
      --border: #e2e2dd;
      --accent: #2c7a3f;
      --accent-hover: #255f32;
      --danger: #b23a3a;
      --warn: #b8860b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    }
    header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.25rem; margin: 0; }
    header a { color: var(--accent); text-decoration: none; margin-left: 1rem; }
    main { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 1.5rem; margin-bottom: 1.5rem;
    }
    button, .btn {
      background: var(--accent); color: #fff; border: 0; padding: 0.5rem 1rem;
      border-radius: 6px; cursor: pointer; font-size: 0.95rem;
      text-decoration: none; display: inline-block;
    }
    button:hover, .btn:hover { background: var(--accent-hover); }
    button.secondary, .btn.secondary {
      background: transparent; color: var(--fg); border: 1px solid var(--border);
    }
    button.secondary:hover { background: var(--bg); }
    button.danger { background: var(--danger); }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left; padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--border); vertical-align: top;
    }
    th { font-weight: 600; color: var(--muted); font-size: 0.85rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    select, input[type="text"], input[type="date"] {
      padding: 0.4rem 0.5rem; border: 1px solid var(--border); border-radius: 4px;
      font-size: 0.95rem; background: #fff;
    }
    .flash { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .flash.success { background: #e2f3e5; color: #14532d; }
    .flash.error   { background: #fbe2e2; color: #7f1d1d; }
    .flash.info    { background: #e2ecf3; color: #1e3a52; }
    .confidence { font-variant-numeric: tabular-nums; }
    .conf-high { color: var(--accent); }
    .conf-med  { color: var(--warn); }
    .conf-low  { color: var(--danger); }
    .status-applied { color: var(--accent); font-weight: 600; }
    .status-error   { color: var(--danger); font-weight: 600; }
    .pill { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px;
            background: #eee; font-size: 0.8rem; color: var(--muted); }
    .row-filters { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; }
    .row-filters label { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>QuickBooks Categorizer</h1>
    <nav>
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('review') }}">Review</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
