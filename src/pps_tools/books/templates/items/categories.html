{% extends "base.html" %}
{% block title %}Product categories{% endblock %}
{% block content %}
<div class="page-head"><div><div class="crumbs"><a href="{{ url_for('items.index') }}">Products and services</a></div><h1>Categories</h1></div></div>
<div class="grid cols-2">
  <div class="card"><table class="data"><thead><tr><th>Category</th><th class="num">Products</th><th></th></tr></thead><tbody>
    {% for c in cats %}<tr><td>{{ c.full_name }}</td><td class="num">{{ counts.get(c.id, 0) }}</td>
      <td class="actions"><form method="post" style="display:inline" onsubmit="return confirm('Remove this category? Products in it become uncategorized.')"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input type="hidden" name="delete" value="{{ c.id }}"><button class="small danger" type="submit">Remove</button></form></td></tr>
    {% else %}<tr><td colspan="3" class="muted">No categories yet.</td></tr>{% endfor %}
  </tbody></table></div>
  <form method="post" class="card"><div class="card-body">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <h3>Add a category</h3>
    <div class="field"><label class="required">Name</label><input name="name" required></div>
    <div class="field"><label>Inside category</label><select name="parent_id"><option value="">— Top level —</option>{% for c in cats %}<option value="{{ c.id }}">{{ c.full_name }}</option>{% endfor %}</select></div>
    <button type="submit" class="primary">Add</button>
  </div></form>
</div>
{% endblock %}
