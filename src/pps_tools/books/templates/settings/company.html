{% extends "base.html" %}
{% block title %}Company profile{% endblock %}
{% block content %}
<div class="page-head"><div><div class="crumbs"><a href="{{ url_for('settings.index') }}">Settings</a></div><h1>Company profile</h1></div></div>
<form method="post" enctype="multipart/form-data" class="card" style="max-width:900px"><div class="card-body">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="form-row">
    <div class="field"><label class="required">Company name</label><input name="name" value="{{ c.name }}" required></div>
    <div class="field"><label>Legal name</label><input name="legal_name" value="{{ c.legal_name or '' }}"></div>
    <div class="field"><label>EIN</label><input name="ein" value="{{ c.ein or '' }}"></div>
  </div>
  <div class="form-row">
    <div class="field"><label>Email</label><input type="email" name="email" value="{{ c.email or '' }}"><div class="hint">Replies to invoices go here; estimate acceptances are sent here too.</div></div>
    <div class="field"><label>Phone</label><input name="phone" value="{{ c.phone or '' }}"></div>
    <div class="field"><label>Website</label><input name="website" value="{{ c.website or '' }}"></div>
  </div>
  <div class="form-row"><div class="field"><label>Street</label><input name="address_line1" value="{{ c.address_line1 or '' }}"></div><div class="field"><label>&nbsp;</label><input name="address_line2" value="{{ c.address_line2 or '' }}"></div></div>
  <div class="form-row narrow"><div class="field"><label>City</label><input name="city" value="{{ c.city or '' }}"></div><div class="field"><label>State</label><input name="state" value="{{ c.state or '' }}"></div>
    <div class="field"><label>ZIP</label><input name="postal_code" value="{{ c.postal_code or '' }}"></div><div class="field"><label>Country</label><input name="country" value="{{ c.country or '' }}"></div></div>
  <div class="form-row">
    <div class="field"><label>Industry</label><input name="industry" value="{{ c.industry or '' }}"></div>
    <div class="field"><label>Business type</label><select name="entity_type">{% for v, l in [('sole_prop', 'Sole proprietor'), ('llc', 'LLC'), ('partnership', 'Partnership'), ('s_corp', 'S corporation'), ('c_corp', 'C corporation'), ('nonprofit', 'Nonprofit')] %}<option value="{{ v }}"{% if c.entity_type == v %} selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
    <div class="field"><label>Time zone</label><input name="timezone" value="{{ c.timezone }}" placeholder="America/New_York"></div>
  </div>
  <div class="field"><label>Logo</label><input type="file" name="logo" accept="image/png,image/jpeg">
    {% if c.logo_attachment_id %}<div class="hint"><img src="{{ url_for('attachments.download', att_id=c.logo_attachment_id, inline=1) }}" alt="Company logo" style="max-height:60px;margin-top:.4rem"><br><label class="inline"><input type="checkbox" name="remove_logo" value="1"> Remove logo</label></div>{% endif %}</div>
  <button type="submit" class="primary">Save</button>
</div></form>
{% endblock %}
