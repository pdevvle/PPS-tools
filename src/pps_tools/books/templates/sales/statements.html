{% extends "base.html" %}
{% block title %}Statements{% endblock %}
{% block content %}
<div class="page-head"><div><div class="crumbs">Sales</div><h1>Create statements</h1></div></div>
<form method="post" class="card">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="filters">
    <div class="field"><label>Statement type</label><select name="kind">
      <option value="balance_forward"{% if kind == 'balance_forward' %} selected{% endif %}>Balance forward</option>
      <option value="open_item"{% if kind == 'open_item' %} selected{% endif %}>Open item (last 365 days)</option>
      <option value="transaction"{% if kind == 'transaction' %} selected{% endif %}>Transaction statement</option></select></div>
    <div class="field"><label>Statement date</label><input type="date" name="statement_date" value="{{ statement_date|date_input }}"></div>
    <div class="field"><label>From</label><input type="date" name="start" value="{{ start|date_input }}"></div>
    <div class="field"><label>To</label><input type="date" name="end" value="{{ end|date_input }}"></div>
    <div class="field"><label>Customers</label><select name="who" onchange="location='?who='+this.value+'&kind='+this.form.kind.value">
      <option value="balance"{% if who == 'balance' %} selected{% endif %}>With a balance</option>
      <option value="overdue"{% if who == 'overdue' %} selected{% endif %}>With overdue invoices</option>
      <option value="all"{% if who == 'all' %} selected{% endif %}>All active</option></select></div>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr><th class="sel"><input type="checkbox" data-select-all="customer_ids" checked></th><th>Customer</th><th>Email</th><th class="num">Balance</th></tr></thead>
    <tbody>
      {% for c in customers %}<tr><td class="sel"><input type="checkbox" name="customer_ids" value="{{ c.id }}" checked></td><td>{{ c.full_name }}</td><td>{{ c.email or '—' }}</td><td class="num">{{ balances.get(c.id, 0)|money }}</td></tr>
      {% else %}<tr><td colspan="4" class="muted">No customers match.</td></tr>{% endfor %}
    </tbody></table></div>
  <div class="card-body toolbar">
    <button type="submit" name="action" value="print" formtarget="_blank">Print or preview</button>
    <button type="submit" name="action" value="email" class="primary">Email statements</button>
  </div>
</form>
{% endblock %}
