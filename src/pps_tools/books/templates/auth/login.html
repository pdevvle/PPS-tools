<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · PPS Books</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='books.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card card"><div class="card-body">
    <div class="brand-line"><span class="logo">B</span> PPS Books</div>
    <h1>Sign in</h1>
    <p class="muted">{{ company.name if company else '' }}</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field"><label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required></div>
      <button type="submit" class="primary" style="width:100%">Sign in</button>
    </form>
    <p class="small muted" style="margin-top:1rem">Forgot your password? Ask your company admin to reset it, or run
      <code>pps books reset-password</code> on the server.</p>
  </div></div>
</div>
</body>
</html>
