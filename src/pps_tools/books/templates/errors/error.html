{% extends "base.html" if user else "errors/bare.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card"><div class="empty">
  <h3>{{ title }}</h3>
  <p>{{ message }}</p>
  <p><a class="btn" href="javascript:history.back()">Go back</a> <a class="btn primary" href="{{ url_for('dashboard.home') }}">Dashboard</a></p>
  <p class="faint small">Error {{ code }}</p>
</div></div>
{% endblock %}
