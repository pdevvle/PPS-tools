  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('sb.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "preact": "/static/vendor/preact.module.js",
        "preact/hooks": "/static/vendor/hooks.module.js",
        "htm": "/static/vendor/htm.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app"><div class="boot-splash"><div class="boot-logo"></div></div></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
