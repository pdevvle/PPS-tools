[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pps-tools"
version = "0.1.0"
description = "Competitor pricing analysis and Switchboard (team inbox, staffing and job scheduling) for Priority Print Service"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "flask>=3.0",
    "anthropic>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
js = ["playwright>=1.40"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.24",
]

[project.scripts]
pps = "pps_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pps_tools.switchboard" = [
    "schema/*.sql",
    "static/*",
    "static/css/*",
    "static/vendor/*",
    "static/widget/*",
    "static/js/*.js",
    "static/js/*/*.js",
    "static/js/*/*/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
