// Compute fold-line fractions accounting for flap offset (inner/tuck panels
// shortened by 1/32" so they nest cleanly). Z-folds and bifolds don't nest.
function getFoldFracs(foldType, panels, foldDim) {
  const NOMINAL = { gate3: [0.25, 0.50, 0.25] };
  const nomFracs = NOMINAL[foldType] || Array(panels).fill(1 / panels);
  const widths = nomFracs.map(f => f * foldDim);
  // Offset multipliers: negative = panel shortened, positive = panel widened; must sum to 0
  const OFF = 1 / 32;
  const OFFSETS = {
    trifold:    [-1, 0, 1],
    roll4:      [-2, -1, 0, 3],
    gate3:      [-1, 2, -1],
    dgate4:     [-1, 1, 1, -1],
    dparallel4: [-1, 1, 1, -1],
  };
  const off = OFFSETS[foldType];
  if (off) off.forEach((m, i) => { widths[i] += m * OFF; });
  const fracs = [];
  let cum = 0;
  for (let i = 0; i < panels - 1; i++) { cum += widths[i]; fracs.push(cum / foldDim); }
  return fracs;
}

    {l:"Paper",v:P.paper,g:"mat"},{l:"Front Print",v:P.frontPrint,g:"mat"},{l:"Back Print",v:P.backPrint,g:"mat"},
    {l:"Press",v:P.press,g:"lab"},{l:"Cutting",v:P.cutting,g:"lab"},{l:"Folding",v:P.folding,g:"lab"},
    {l:"Vivid Print",v:P.vivid,g:"add"},{l:"UV Coating",v:P.coat,g:"add"},{l:"Bundling",v:P.bundle,g:"add"},
    {l:"Perforation",v:P.perforation,g:"add"},{l:"Round Cornering",v:P.rc,g:"add"},
    {l:"Fold Surcharge 1",v:P.diffFold1,g:"fee"},{l:"Fold Surcharge 2",v:P.diffFold2,g:"fee"},{l:"Fold Surcharge 3",v:P.diffFold3,g:"fee"},
    {l:"Non-Inventory",v:P.nonInv,g:"fee"},
    {l:"Artwork",v:P.artwork,g:"art"},{l:"Bleed",v:P.bleed,g:"art"},{l:"Proofing",v:P.proof,g:"art"},
    {l:"BW Discount",v:P.discBW,g:"disc"},{l:"Easy Discount (Flat)",v:P.discEasyFlat,g:"disc"},{l:"Easy Discount",v:P.discEasy,g:"disc"},{l:"Cardstock Disc",v:P.cardstockDisc,g:"disc"},
  ].filter(r => Math.abs(r.v) > 0.005);

  const gC={mat:CK.cyan,lab:CK.key,add:CK.yellow,art:CK.magenta,fee:"#c25050",disc:CK.cyan};
  const gL={mat:"Materials & Ink",lab:"Production Labor",add:"Addons",art:"Artwork & Proofing",fee:"Fees & Surcharges",disc:"Discounts"};
  const grouped=Object.entries(gL).map(([k,label])=>({label,val:bd.filter(r=>r.g===k).reduce((s,r)=>s+r.v,0),c:gC[k]})).filter(g=>Math.abs(g.val)>0.005);

  const perUnit = qty > 0 ? grandTotal / qty : 0;

  return {
    total: Math.round(grandTotal * 100) / 100, baseTotal: Math.round(total * 100) / 100,
    perUnit: Math.round(perUnit * 100) / 100, days, qty: qty, bd, grouped,
    imp, mk, fold, panels, pressSheets, longE, shortE, approxThickness,
    coatOK: paper.coatable, q100: qty >= 100, ti,
    shipping: {
      transitDays, effectiveTransit, freeDeliveryBizDays, freeDeliveryDate: fmtDate(freeDeliveryDate), freeDeliveryYMD: toYMD(freeDeliveryDate),
      earliestBizDays, earliestDate: fmtDate(earliestDate), earliestYMD: toYMD(earliestDate), shopToday: fmtDate(shopToday),
      bizDaysToDate, rushMultiplier, rushCost: Math.round(rushCost * 100) / 100,
      needByValid, needByPast, tooSoon, productionBizDays, bufferedProdDays,
      productionStartDate: fmtDate(productionStartDate), productionStartYMD: toYMD(productionStartDate),
      mustShipDate: fmtDate(mustShipDate), mustShipYMD: toYMD(mustShipDate),
    },
    debug: { pressSheets, imp, qty, mk, dL, approxThickness, fold: fold.label, panels, longE, shortE, paperDays, baseDays, days, P },
  };
}

// DOWNLOADABLE BROCHURE TEMPLATE (jsPDF)
// ═══════════════════════════════════════════════════════════════

function drawDashedLine(pdf, x1, y1, x2, y2, dashLen, gapLen) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len === 0) return;
  var ux = dx / len, uy = dy / len;
  var pos = 0, drawing = true;
  while (pos < len) {
    var segLen = drawing ? dashLen : gapLen;
    if (pos + segLen > len) segLen = len - pos;
    if (drawing) pdf.line(x1 + ux * pos, y1 + uy * pos, x1 + ux * (pos + segLen), y1 + uy * (pos + segLen));
    pos += segLen; drawing = !drawing;
  }
}
function drawDashedRect(pdf, x, y, w, h, dashLen, gapLen) {
  drawDashedLine(pdf, x, y, x + w, y, dashLen, gapLen);
  drawDashedLine(pdf, x + w, y, x + w, y + h, dashLen, gapLen);
  drawDashedLine(pdf, x + w, y + h, x, y + h, dashLen, gapLen);
  drawDashedLine(pdf, x, y + h, x, y, dashLen, gapLen);
}

function generateBrochureTemplate(longE, shortE, foldType, panels, foldDir, sizeLabel, perfCount, perfDir, perfPositions) {
  try {
    if (!window.jspdf) { alert("PDF library not loaded. Please refresh."); return; }
    const { jsPDF } = window.jspdf;
    const bleed = 0.125, safety = 0.125;
    const trimW = longE, trimH = shortE;
    const docW = trimW + bleed * 2;
    const docH = trimH + bleed * 2;
    const pdf = new jsPDF({ orientation: docW > docH ? "l" : "p", unit: "in", format: [docW, docH] });

    for (let pg = 0; pg < 2; pg++) {
      if (pg > 0) pdf.addPage([docW, docH], docW > docH ? "l" : "p");
      const label = pg === 0 ? "Front / Outside" : "Back / Inside";

      // Light grey bleed zone background
      pdf.setFillColor(240, 240, 240);
      pdf.rect(0, 0, docW, docH, "F");

      // White trim area
      pdf.setFillColor(255, 255, 255);
      pdf.rect(bleed, bleed, trimW, trimH, "F");

      // Bleed line — red solid at document edge
      pdf.setDrawColor(229, 62, 62);
      pdf.setLineWidth(0.012);
      pdf.rect(0.006, 0.006, docW - 0.012, docH - 0.012, "S");

      // Trim line — black dashed
      pdf.setDrawColor(30, 30, 30);
      pdf.setLineWidth(0.01);
      drawDashedRect(pdf, bleed, bleed, trimW, trimH, 0.08, 0.05);

      // Safety line — green dashed
      pdf.setDrawColor(56, 161, 105);
      pdf.setLineWidth(0.008);
      drawDashedRect(pdf, bleed + safety, bleed + safety, trimW - safety * 2, trimH - safety * 2, 0.05, 0.03);

      // Fold lines — orange dashed, with flap offset for nesting folds
      if (panels > 1) {
        pdf.setDrawColor(245, 166, 35);
        pdf.setLineWidth(0.01);
        const foldingLong = foldDir === "long";
        const tplFoldDim = foldingLong ? trimW : trimH;
        const tplFracs = getFoldFracs(foldType, panels, tplFoldDim);
        for (let i = 0; i < tplFracs.length; i++) {
          const frac = tplFracs[i];
          if (foldingLong) {
            const x = bleed + trimW * frac;
            drawDashedLine(pdf, x, bleed + 0.1, x, bleed + trimH - 0.1, 0.08, 0.04);
            pdf.setFontSize(6); pdf.setTextColor(245, 166, 35);
            pdf.text("FOLD " + (i + 1), x + 0.04, bleed + 0.25);
          } else {
            const y = bleed + trimH * frac;
            drawDashedLine(pdf, bleed + 0.1, y, bleed + trimW - 0.1, y, 0.08, 0.04);
            pdf.setFontSize(6); pdf.setTextColor(245, 166, 35);
            pdf.text("FOLD " + (i + 1), bleed + 0.15, y - 0.04);
          }
        }
      }

      // Perf lines (purple dashed)
      if (perfCount > 0 && perfPositions) {
        pdf.setDrawColor(139, 92, 246);
        pdf.setLineWidth(0.01);
        const perfVertical2 = perfDir === "length" ? (foldDir === "long") : (foldDir !== "long");
        for (let i = 0; i < Math.min(perfCount, perfPositions.length); i++) {
          const frac = perfPositions[i] / 100;
          if (perfVertical2) {
            const x = bleed + trimW * frac;
            drawDashedLine(pdf, x, bleed + 0.1, x, bleed + trimH - 0.1, 0.08, 0.04);
            pdf.setFontSize(6); pdf.setTextColor(139, 92, 246);
            pdf.text("PERF " + (i + 1), x + 0.04, bleed + trimH - 0.15);
          } else {
            const y = bleed + trimH * frac;
            drawDashedLine(pdf, bleed + 0.1, y, bleed + trimW - 0.1, y, 0.08, 0.04);
            pdf.setFontSize(6); pdf.setTextColor(139, 92, 246);
            pdf.text("PERF " + (i + 1), bleed + 0.15, y - 0.04);
          }
        }
      }

      // Panel labels
      const panelCfg = PANEL_LABELS[foldType];
      if (panelCfg && panels > 1) {
        const labels = pg === 0 ? panelCfg.front : panelCfg.back;
        const foldingLong2 = foldDir === "long";
        const tplFoldDim2 = foldingLong2 ? trimW : trimH;
        const tplEdges = [0, ...getFoldFracs(foldType, panels, tplFoldDim2), 1];
        const tplCenters = Array.from({length: panels}, (_, i) => (tplEdges[i] + tplEdges[i + 1]) / 2);
        pdf.setFontSize(8); pdf.setTextColor(180, 140, 60);
        for (let p = 0; p < labels.length; p++) {
          const cx = foldingLong2
            ? bleed + trimW * tplCenters[p]
            : bleed + trimW / 2;
          const cy = foldingLong2
            ? bleed + trimH / 2 + 0.15
            : bleed + trimH * tplCenters[p];
          pdf.text(labels[p], cx, cy, { align: "center" });
        }
      }

      // Text watermark — tiled "PriorityPrintService.com"
      var tileSize = Math.min(trimW * 0.2, 1.2);
      var tileStep = tileSize * 1.6;
      var safeL = bleed + safety, safeT = bleed + safety;
      var safeW = trimW - safety * 2, safeH = trimH - safety * 2;
      var cols = Math.floor(safeW / tileStep), rows = Math.floor(safeH / tileStep);
      var gridW = cols * tileStep, gridH = rows * tileStep;
      var offX = safeL + (safeW - gridW) / 2, offY = safeT + (safeH - gridH) / 2;
      pdf.setFontSize(tileSize * 3.5);
      pdf.setTextColor(230, 230, 230);
      for (var row = 0; row < rows; row++) {
        for (var col = 0; col < cols; col++) {
          pdf.text("PriorityPrintService.com", offX + col * tileStep + tileStep / 2, offY + row * tileStep + tileStep / 2, { align: "center" });
        }
      }

      // Page label
      var cx = docW / 2;
      pdf.setFontSize(10); pdf.setTextColor(170, 170, 170);
      pdf.text(label, cx, docH / 2 - 0.1, { align: "center" });

      // Dimensions
      pdf.setFontSize(7); pdf.setTextColor(190, 190, 190);
      pdf.text("Trim: " + trimW + '" \u00d7 ' + trimH + '"  |  With bleeds: ' + docW.toFixed(3) + '" \u00d7 ' + docH.toFixed(3) + '"', cx, docH / 2 + 0.12, { align: "center" });
      if (panels > 1) {
        var foldDim = foldDir === "long" ? trimW : trimH;
        var staticDim = foldDir === "long" ? trimH : trimW;
        pdf.text("Folded: " + staticDim.toFixed(1) + '" \u00d7 ' + (foldDim / panels).toFixed(1) + '"  (' + panels + ' panels)', cx, docH / 2 + 0.3, { align: "center" });
      }

      // URL
      pdf.setFontSize(7); pdf.setTextColor(150, 150, 150);
      pdf.text("priorityprintservice.com", cx, docH - bleed - 0.08, { align: "center" });

      // Legend on first page
      if (pg === 0) {
        var lx = bleed + safety + 0.1;
        var ly = docH - bleed - 0.42;
        pdf.setFontSize(6);
        pdf.setTextColor(229, 62, 62);
        pdf.text("\u2014 Bleed (extend backgrounds to this edge)", lx, ly - 0.24);
        pdf.setTextColor(30, 30, 30);
        pdf.text("- - Trim (cut line)", lx, ly - 0.16);
        pdf.setTextColor(56, 161, 105);
        pdf.text("- - Safety (keep text inside)", lx, ly - 0.08);
        if (panels > 1) { pdf.setTextColor(245, 166, 35); pdf.text("- - Fold lines", lx, ly); }
        if (perfCount > 0) { pdf.setTextColor(139, 92, 246); pdf.text("- - Perf lines", lx, ly + 0.08); }
      }
    }

    var safeName = (sizeLabel || (longE + "x" + shortE)).replace(/[^a-zA-Z0-9._-]/g, "_");
    var foldName = foldType === "flat" ? "flat" : foldType;
    pdf.save("PPS_Brochure_Template_" + safeName + "_" + foldName + ".pdf");
  } catch (e) {
    console.error("Template generation failed:", e);
    alert("Template generation failed: " + e.message);
  }
}

// Sanitize src for innerHTML injection — only allow data: URIs
function safeSrc(src) { return src && src.startsWith("data:") ? src : ""; }

// Panel face builder — maps artwork onto front/back of each panel
// Wrap image in a positioned div — crops to trim area like the proof modal
// rW/rH = rendered image size in px (mapped 1:1 to physical inches), centered in iW×iH
function foldImgWrap(src, iW, iH, ml, mt, rW, rH) {
  if (!src) return "";
  var imgStyle;
  if (rW && rH) {
    // Crop mode: render at physical-inch scale, centered, overflow clipped
    var ox = (iW - rW) / 2, oy = (iH - rH) / 2;
    imgStyle = "width:" + rW.toFixed(1) + "px;height:" + rH.toFixed(1) + "px;position:absolute;left:" + ox.toFixed(1) + "px;top:" + oy.toFixed(1) + "px;display:block";
  } else {
    imgStyle = "width:100%;height:100%;object-fit:contain;display:block";
  }
  return '<div style="width:' + iW + 'px;height:' + iH + 'px;margin-left:' + ml + 'px;margin-top:' + mt + 'px;position:relative;overflow:hidden"><img src="' + safeSrc(src) + '" style="' + imgStyle + '"></div>';
}

function foldMkF(idx, n, pw, ph, iW, iH, isP, frontSrc, backSrc, swap, fRW, fRH, bRW, bRH) {
  const bi = n - 1 - idx;
  const fS = swap ? backSrc : frontSrc, bS = swap ? frontSrc : backSrc;
  const frw = swap ? bRW : fRW, frh = swap ? bRH : fRH, brw = swap ? fRW : bRW, brh = swap ? fRH : bRH;
  let fml=0, fmt=0, bml=0, bmt=0;
  if (isP) { fmt = -ph*idx; bmt = -ph*bi; } else { fml = -pw*idx; bml = -pw*bi; }
  return `<div class="fold-face ff" style="width:${pw}px;height:${ph}px;background:#fff">${foldImgWrap(fS,iW,iH,fml,fmt,frw,frh)}</div><div class="fold-face fb" style="width:${pw}px;height:${ph}px;background:#fff">${foldImgWrap(bS,iW,iH,bml,bmt,brw,brh)}</div>`;
}

// Gate face builder — source divided into quarters
function foldMkFGate(startQ, spanQ, qw, qh, iW, iH, isP, totalQ, frontSrc, backSrc, fRW, fRH, bRW, bRH) {
  const bStartQ = totalQ - startQ - spanQ;
  const pw = isP ? qw : qw*spanQ, ph = isP ? qh*spanQ : qh;
  const fml = isP ? 0 : -qw*startQ, fmt = isP ? -qh*startQ : 0;
  const bml = isP ? 0 : -qw*bStartQ, bmt = isP ? -qh*bStartQ : 0;
  return `<div class="fold-face ff" style="width:${pw}px;height:${ph}px;background:#fff">${foldImgWrap(frontSrc,iW,iH,fml,fmt,fRW,fRH)}</div><div class="fold-face fb" style="width:${pw}px;height:${ph}px;background:#fff">${foldImgWrap(backSrc,iW,iH,bml,bmt,bRW,bRH)}</div>`;
}

// Recursive nested builder (accordion, half, roll)
function foldBuildNest(idx, n, pw, ph, iW, iH, isP, fSrc, bSrc, fRW, fRH, bRW, bRH) {
  const last = idx === n-1;
  let h = `<div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">`;
  h += foldMkF(idx, n, pw, ph, iW, iH, isP, fSrc, bSrc, false, fRW, fRH, bRW, bRH);
  if (!last) {
    const hp = isP ? `left:0;top:${ph}px;` : `left:${pw}px;top:0;`;
    const og = isP ? "center top" : "left center";
    h += `<div class="fold-hinge" id="fh${idx+1}" style="${hp}width:${pw}px;height:${ph}px;transform-origin:${og}">`;
    h += foldBuildNest(idx+1, n, pw, ph, iW, iH, isP, fSrc, bSrc, fRW, fRH, bRW, bRH);
    h += `</div>`;
  }
  h += `</div>`; return h;
}

// Tri-fold builder (center base, left/right hinges)
function foldBuildTri(pw, ph, iW, iH, isP, n, fSrc, bSrc, fRW, fRH, bRW, bRH) {
  let h = "";
  if (isP) {
    h += `<div class="fold-panel-wrap" style="left:0;top:${ph}px;width:${pw}px;height:${ph}px">`;
    h += foldMkF(1,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH);
    h += `<div class="fold-hinge" id="fhL" style="left:0;top:${-ph}px;width:${pw}px;height:${ph}px;transform-origin:center bottom"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(0,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `<div class="fold-hinge" id="fhR" style="left:0;top:${ph}px;width:${pw}px;height:${ph}px;transform-origin:center top"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(2,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `</div>`;
  } else {
    h += `<div class="fold-panel-wrap" style="left:${pw}px;top:0;width:${pw}px;height:${ph}px">`;
    h += foldMkF(1,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH);
    h += `<div class="fold-hinge" id="fhL" style="left:${-pw}px;top:0;width:${pw}px;height:${ph}px;transform-origin:right center"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(0,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `<div class="fold-hinge" id="fhR" style="left:${pw}px;top:0;width:${pw}px;height:${ph}px;transform-origin:left center"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(2,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `</div>`;
  }
  return h;
}

// Gate fold builder (25%+50%+25%)
function foldBuildGate(qw, qh, iW, iH, isP, fSrc, bSrc, fRW, fRH, bRW, bRH) {
  let h = "";
  if (isP) {
    const cH = qh*2;
    h += `<div class="fold-hinge" id="fhGL" style="left:0;top:0;width:${qw}px;height:${qh}px;transform-origin:center bottom">${foldMkFGate(0,1,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-panel-wrap" style="left:0;top:${qh}px;width:${qw}px;height:${cH}px">${foldMkFGate(1,2,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhGR" style="left:0;top:${qh+cH}px;width:${qw}px;height:${qh}px;transform-origin:center top">${foldMkFGate(3,1,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
  } else {
    const cW = qw*2;
    h += `<div class="fold-hinge" id="fhGL" style="left:0;top:0;width:${qw}px;height:${qh}px;transform-origin:right center">${foldMkFGate(0,1,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-panel-wrap" style="left:${qw}px;top:0;width:${cW}px;height:${qh}px">${foldMkFGate(1,2,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhGR" style="left:${qw+cW}px;top:0;width:${qw}px;height:${qh}px;transform-origin:left center">${foldMkFGate(3,1,qw,qh,iW,iH,isP,4,fSrc,bSrc,fRW,fRH,bRW,bRH)}</div>`;
  }
  return h;
}

// Double gate builder (4 equal panels, flaps fold in, center folds over)
function foldBuildDGate(pw, ph, iW, iH, isP, n, fSrc, bSrc, fRW, fRH, bRW, bRH) {
  let h = "";
  if (isP) {
    h += `<div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph*2}px">`;
    h += `<div class="fold-panel-wrap" style="left:0;top:${ph}px;width:${pw}px;height:${ph}px">${foldMkF(1,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhL" style="left:0;top:0;width:${pw}px;height:${ph}px;transform-origin:center bottom"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(0,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `<div class="fold-hinge" id="fhCtr" style="left:0;top:${ph*2}px;width:${pw}px;height:${ph*2}px;transform-origin:center top">`;
    h += `<div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(2,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhR" style="left:0;top:${ph}px;width:${pw}px;height:${ph}px;transform-origin:center top"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(3,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `</div></div>`;
  } else {
    h += `<div class="fold-panel-wrap" style="left:0;top:0;width:${pw*2}px;height:${ph}px">`;
    h += `<div class="fold-panel-wrap" style="left:${pw}px;top:0;width:${pw}px;height:${ph}px">${foldMkF(1,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhL" style="left:0;top:0;width:${pw}px;height:${ph}px;transform-origin:right center"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(0,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `<div class="fold-hinge" id="fhCtr" style="left:${pw*2}px;top:0;width:${pw*2}px;height:${ph}px;transform-origin:left center">`;
    h += `<div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(2,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div>`;
    h += `<div class="fold-hinge" id="fhR" style="left:${pw}px;top:0;width:${pw}px;height:${ph}px;transform-origin:left center"><div class="fold-panel-wrap" style="left:0;top:0;width:${pw}px;height:${ph}px">${foldMkF(3,n,pw,ph,iW,iH,isP,fSrc,bSrc,true,fRW,fRH,bRW,bRH)}</div></div>`;
    h += `</div></div>`;
  }
  return h;
}

// Apply a view config to the scene DOM — sets all hinge transforms with anti-clipping translateZ
function foldApplyView(sceneEl, foldKey, viewIdx, dirSign) {
  const fold = FOLDS_3D[foldKey]; if (!fold) return;
  const view = fold.views[viewIdx]; if (!view) return;
  const s = dirSign || 1;
  const isP = false; // landscape for now (could be extended)
  let [rx, ry, tx, ty] = view.sc;
  if (s < 0) ry = -ry;

  sceneEl.style.transition = "transform 1.4s cubic-bezier(.4,0,.2,1)";
  sceneEl.style.transform = `scale(1) rotateX(${rx}deg) rotateY(${ry}deg) translateX(${tx}px) translateY(${ty}px)`;

  const $ = id => sceneEl.querySelector("#" + id);

  if (fold.mode === "trifold") {
    const [lA, rA] = view.f;
    const tzf = view.tzf_tf || [0, 0];
    const hL = $("fhL"), hR = $("fhR");
    const pw = hL ? parseInt(hL.style.width) || 0 : 0;
    if (hR) hR.style.transform = `${tzf[1]?`translateZ(${(tzf[1]*pw).toFixed(1)}px) `:""}rotateY(${rA*s}deg)`;
    if (hL) hL.style.transform = `${tzf[0]?`translateZ(${(tzf[0]*pw).toFixed(1)}px) `:""}rotateY(${lA*s}deg)`;
  } else if (fold.mode === "gate3") {
    const [lA, rA] = view.g;
    const gL = $("fhGL"), gR = $("fhGR");
    if (gL) gL.style.transform = `rotateY(${lA*s}deg)`;
    if (gR) gR.style.transform = `rotateY(${rA*s}deg)`;
  } else if (fold.mode === "dgate") {
    const [lA, rA, cA] = view.dg;
    const tzf = view.tzf || [0, 0, 0];
    const hL = $("fhL"), hR = $("fhR"), hC = $("fhCtr");
    const pw = hL ? parseInt(hL.style.width) || 0 : 0;
    if (hL) hL.style.transform = `${tzf[0]?`translateZ(${(tzf[0]*pw).toFixed(1)}px) `:""}rotateY(${lA*s}deg)`;
    if (hR) hR.style.transform = `${tzf[1]?`translateZ(${(tzf[1]*pw).toFixed(1)}px) `:""}rotateY(${rA*s}deg)`;
    if (hC) hC.style.transform = `${tzf[2]?`translateZ(${(tzf[2]*pw).toFixed(1)}px) `:""}rotateY(${cA*s}deg)`;
  } else {
    // Nested mode (accordion, half, roll)
    const tzf = view.tzf;
    view.f.forEach((a, i) => {
      const h = $("fh" + (i + 1)); if (!h) return;
      let tz = "";
      if (tzf && tzf[i]) { const pw = parseInt(h.style.width) || 0; tz = `translateZ(${(tzf[i]*pw).toFixed(1)}px) `; }
      h.style.transform = `${tz}rotateY(${a*s}deg)`;
    });
  }
}

// React component that renders the 3D fold scene
function FoldRenderer({ foldKey, frontSrc, backSrc, frontDims, backDims, longEdge, shortEdge, viewIdx, foldDir, flipped, frontGray, backGray }) {
  const sceneRef = useRef(null);
  const fold = FOLDS_3D[foldKey];

  const mob = useIsMobile();
  const isP = false; // landscape
  const maxDim = mob ? 260 : 400;
  const nPanels = fold ? (fold.mode === "gate3" ? 4 : fold.n) : 1;
  const pa = (longEdge / nPanels) / shortEdge;
  const pw = Math.round(Math.min(maxDim / nPanels, (mob ? window.innerWidth - 80 : 700) / nPanels));
  const ph = Math.round(pw / pa);
  const iW = pw * nPanels;
  const iH = ph;
  const qw = fold && fold.mode === "gate3" ? iW / 4 : pw;

  // Compute rendered image sizes — map art inches to trim pixels (1:1 physical scale)
  const scale = iW / longEdge;
  const fRW = frontDims ? frontDims.w * scale : null;
  const fRH = frontDims ? frontDims.h * scale : null;
  const bRW = backDims ? backDims.w * scale : null;
  const bRH = backDims ? backDims.h * scale : null;

  // Build scene HTML
  useEffect(() => {
    if (!sceneRef.current || !fold) return;
    const fSrc = frontSrc || null, bSrc = backSrc || null;
    let html = "";
    // Roll fold: panels fold inward onto the back/inside, so swap art
    const swapArt = foldKey === "roll-fold";
    const sf = swapArt ? bSrc : fSrc, sb = swapArt ? fSrc : bSrc;
    const sfrw = swapArt ? bRW : fRW, sfrh = swapArt ? bRH : fRH;
    const sbrw = swapArt ? fRW : bRW, sbrh = swapArt ? fRH : bRH;
    if (fold.mode === "nested") {
      html = foldBuildNest(0, fold.n, pw, ph, iW, iH, isP, sf, sb, sfrw, sfrh, sbrw, sbrh);
    }
    else if (fold.mode === "trifold") html = foldBuildTri(pw, ph, iW, iH, isP, fold.n, fSrc, bSrc, fRW, fRH, bRW, bRH);
    else if (fold.mode === "gate3") html = foldBuildGate(qw, ph, iW, iH, isP, fSrc, bSrc, fRW, fRH, bRW, bRH);
    else if (fold.mode === "dgate") html = foldBuildDGate(pw, ph, iW, iH, isP, fold.n, fSrc, bSrc, fRW, fRH, bRW, bRH);
    sceneRef.current.innerHTML = html;
    // Apply greyscale filters — ff=front face, fb=back face
    // For roll fold, art is swapped so ff shows back art and fb shows front art
    var ffGray = swapArt ? backGray : frontGray;
    var fbGray = swapArt ? frontGray : backGray;
    sceneRef.current.querySelectorAll(".ff img").forEach(function(img) { img.style.filter = ffGray ? "grayscale(1)" : "none"; });
    sceneRef.current.querySelectorAll(".fb img").forEach(function(img) { img.style.filter = fbGray ? "grayscale(1)" : "none"; });
    setTimeout(() => { if (sceneRef.current) foldApplyView(sceneRef.current, foldKey, viewIdx || 0, flipped ? -1 : 1); }, 50);
  }, [frontSrc, backSrc, foldKey, pw, ph, flipped, frontGray, backGray, fRW, fRH, bRW, bRH]);

  // Apply view changes
  useEffect(() => {
    if (!sceneRef.current || !fold) return;
    foldApplyView(sceneRef.current, foldKey, viewIdx || 0, flipped ? -1 : 1);
  }, [viewIdx, foldDir, flipped]);

  if (!fold) return <div style={{ padding: 40, textAlign: "center", color: "rgba(255,255,255,.4)" }}>Flat — no fold preview</div>;

  return (
    <div className="fold-viewport" style={{ minHeight: mob ? 220 : 350 }}>
      <div ref={sceneRef} className="fold-scene"
        style={{ transformStyle: "preserve-3d", position: "relative", width: iW, height: iH }} />
    </div>
  );
}


// ═══════════════════════════════════════════════════════════════
// SHEET PREVIEW — Upload + Proof for single-sheet products (brochures, flat printing)
// ═══════════════════════════════════════════════════════════════

function SheetPreview({ longEdge, shortEdge, foldType, foldDir, panels, perfCount, perfDir, perfPositions, onPerfPositions, frontColor, backColor, sides, onSizeOverride, onFoldChange, onFoldDirChange, sizeMode, onArtwork }) {
  const mob = useIsMobile();
  const hasIO = panels > 1 && foldType !== "z3";
  const fLabel = hasIO ? "Front / Outside" : "Front";
  const bLabel = hasIO ? "Back / Inside" : "Back";
  const [frontArt, setFrontArt] = useState(null); // {dataUrl, file, dims:{w,h}}
  const [backArt, setBackArt] = useState(null);
  const [side, setSide] = useState("front"); // "front" | "back"
  const [foldFlipped, setFoldFlipped] = useState(false);
  const canFlip = panels > 1 && !["gate3","dgate4"].includes(foldType);
  // Reset flip when fold type changes
  const prevFoldType = useRef(foldType);
  if (prevFoldType.current !== foldType) { prevFoldType.current = foldType; if (foldFlipped) setFoldFlipped(false); }
  const [proofOpen, setProofOpen] = useState(false);
  const [previewOpen, setPreviewOpen] = useState(false);
  const [previewAngle, setPreviewAngle] = useState(0);
  const [approved, setApproved] = useState(false);
  const [dropHover, setDropHover] = useState(false);
  const [loading, setLoading] = useState(false);
  const [fileName, setFileName] = useState("");
  const [fitMode, setFitMode] = useState("crop");
  const [artScale, setArtScale] = useState(100);
  const [rotateSteps, setRotateSteps] = useState(0);
  const [draggingPerf, setDraggingPerf] = useState(null);
  const [editingPerf, setEditingPerf] = useState(null); // index of perf being edited via text input
  const [editPerfVal, setEditPerfVal] = useState("");
  const proofContainerRef = useRef(null);
  const fileRef = useRef(null);
  const frontInputRef = useRef(null);
  const backInputRef = useRef(null);
  const rawFileRef = useRef(null);

  // Clear approval when transforms change
  const prevTransforms = useRef({ fitMode, artScale, rotateSteps });
  useEffect(() => {
    const prev = prevTransforms.current;
    if (prev.fitMode !== fitMode || prev.artScale !== artScale || prev.rotateSteps !== rotateSteps) {
      if (approved) setApproved(false);
      prevTransforms.current = { fitMode, artScale, rotateSteps };
    }
  }, [fitMode, artScale, rotateSteps]);

  // Rotate a dataUrl image by N steps of 90° clockwise
  function rotateImageBySteps(dataUrl, steps) {
    if (steps <= 0) return Promise.resolve(dataUrl);
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const s = ((steps % 4) + 4) % 4;
        const swap = s % 2 === 1;
        const c = document.createElement("canvas");
        c.width = swap ? img.naturalHeight : img.naturalWidth;
        c.height = swap ? img.naturalWidth : img.naturalHeight;
        const ctx = c.getContext("2d");
        ctx.translate(c.width / 2, c.height / 2);
        ctx.rotate((s * Math.PI) / 2);
        ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  // Effective art dimensions after rotation
  const currentArtRaw = side === "front" ? frontArt : backArt;
  const effectiveDims = useMemo(() => {
    if (!currentArtRaw?.dims) return null;
    const d = currentArtRaw.dims;
    if (rotateSteps % 2 === 1) return { w: d.h, h: d.w };
    return d;
  }, [currentArtRaw, rotateSteps]);

  // Rotated art dataUrl
  const [rotatedUrl, setRotatedUrl] = useState(null);
  useEffect(() => {
    if (!currentArtRaw?.dataUrl) { setRotatedUrl(null); return; }
    if (rotateSteps === 0) { setRotatedUrl(currentArtRaw.dataUrl); return; }
    let cancelled = false;
    rotateImageBySteps(currentArtRaw.dataUrl, rotateSteps).then(url => { if (!cancelled) setRotatedUrl(url); });
    return () => { cancelled = true; };
  }, [currentArtRaw?.dataUrl, rotateSteps]);

  // FitToggle component
  const FitToggle = () => (
    <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
      <div style={{ display: "flex", borderRadius: 6, overflow: "hidden", border: "1px solid rgba(255,255,255,.12)" }}>
        {[{ v: "crop", l: "Crop" }, { v: "cover", l: "Fill" }, { v: "contain", l: "Fit" }, { v: "stretch", l: "Stretch" }, { v: "scale", l: "Scale" }].map(o => (
          <button type="button" key={o.v} onClick={() => { setFitMode(o.v); if (o.v === "scale") setArtScale(100); }} style={{
            padding: "6px 12px", fontSize: 10, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit",
            background: fitMode === o.v ? CK.cyan : "rgba(255,255,255,.06)",
            color: fitMode === o.v ? "#000" : "rgba(255,255,255,.5)",
          }}>{o.l}</button>
        ))}
        <button type="button" onClick={() => setRotateSteps(s => (s + 1) % 4)} style={{
          padding: "6px 12px", fontSize: 10, fontWeight: 600, border: "none", borderLeft: "1px solid rgba(255,255,255,.08)", cursor: "pointer", fontFamily: "inherit",
          background: rotateSteps > 0 ? CK.cyan : "rgba(255,255,255,.06)",
          color: rotateSteps > 0 ? "#000" : "rgba(255,255,255,.5)",
        }}>Rotate 90°{rotateSteps > 0 ? ` (${rotateSteps * 90}°)` : ""}</button>
      </div>
      {fitMode === "scale" && (
        <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
          <div style={{ display: "flex", borderRadius: 6, overflow: "hidden", border: "1px solid rgba(255,255,255,.12)" }}>
            <button type="button" onClick={() => setArtScale(s => Math.max(10, s - 1))} style={{ padding: "6px 10px", fontSize: 12, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: "rgba(255,255,255,.06)", color: "rgba(255,255,255,.5)" }}>−</button>
            <button type="button" onClick={() => setArtScale(s => Math.min(300, s + 1))} style={{ padding: "6px 10px", fontSize: 12, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: "rgba(255,255,255,.06)", color: "rgba(255,255,255,.5)" }}>+</button>
          </div>
          <span style={{ fontSize: 10, fontWeight: 600, color: "rgba(255,255,255,.4)", minWidth: 32, textAlign: "center" }}>{artScale}%</span>
        </div>
      )}
      {fitMode === "stretch" && (
        <button type="button" onClick={() => setFitMode("crop")} style={{ padding: "5px 12px", fontSize: 10, fontWeight: 700, border: "1px solid rgba(239,68,68,.4)", borderRadius: 4, cursor: "pointer", fontFamily: "inherit", background: "rgba(239,68,68,.12)", color: "#f87171" }}>Reset Stretch</button>
      )}
    </div>
  );

  const BLEED = 0.125;
  const bleedW = longEdge + BLEED * 2;
  const bleedH = shortEdge + BLEED * 2;
  const bleedPctX = (BLEED / bleedW) * 100;
  const bleedPctY = (BLEED / bleedH) * 100;
  const safetyPctX = ((BLEED + 0.125) / bleedW) * 100;
  const safetyPctY = ((BLEED + 0.125) / bleedH) * 100;

  async function processFile(fileList) {
    if (!fileList || !fileList.length) return;
    const file = fileList[0];
    setLoading(true);
    setFileName(file.name);
    rawFileRef.current = file;

    try {
      if (file.type === "application/pdf") {
        const buf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        const renderPage = async (num) => {
          const pg = await pdf.getPage(num);
          const vp = pg.getViewport({ scale: 2 });
          const c = document.createElement("canvas");
          c.width = vp.width; c.height = vp.height;
          await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
          const [x0, y0, x1, y1] = pg.view;
          return { dataUrl: c.toDataURL("image/jpeg", 0.85), dims: { w: (x1 - x0) / 72, h: (y1 - y0) / 72 } };
        };
        const front = await renderPage(1);
        setFrontArt({ ...front, file });
        if (pdf.numPages >= 2) {
          const back = await renderPage(2);
          setBackArt({ ...back, file });
        }
      } else {
        const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(file); });
        if (!dataUrl) return;
        const dims = await new Promise((res) => { const img = new Image(); img.onload = () => res({ w: img.naturalWidth / 300, h: img.naturalHeight / 300 }); img.onerror = () => res({ w: 0, h: 0 }); img.src = dataUrl; });
        setFrontArt({ dataUrl, file, dims });
      }
      setApproved(false);
      if (onArtwork) onArtwork({ type: "files", list: [file] });
    } catch (e) { console.error("File processing failed:", e); }
    setLoading(false);
  }

  function handleClear() {
    setFrontArt(null); setBackArt(null); setFileName(""); setApproved(false);
    rawFileRef.current = null;
    if (onArtwork) onArtwork({ type: "none" });
  }

  const hasArt = !!frontArt;
  const currentArt = side === "front" ? frontArt : backArt;

  // Fold line positions as percentages, with flap offset for nesting folds
  const foldLines = [];
  const foldDim = foldDir === "long" ? longEdge : shortEdge;
  const panelFracs = panels > 1 ? getFoldFracs(foldType, panels, foldDim) : [];
  if (panels > 1) {
    const foldingLong = foldDir === "long";
    for (const frac of panelFracs) {
      foldLines.push({ pct: frac * 100, vertical: foldingLong });
    }
  }


  // Perf line positions — perfDir "length" crosses longEdge (vertical when foldDir=long)
  const perfVertical = perfDir === "length" ? (foldDir === "long") : (foldDir !== "long");
  const perfLines = (perfCount > 0 && perfPositions)
    ? perfPositions.slice(0, perfCount).map((pct, i) => ({ pct, vertical: perfVertical, index: i }))
    : [];

  // Perf constraint: 1" from edge, 1" between perfs, snap to 1/8"
  function clampPerfInches(inches, idx, trimDim, positions) {
    var minIn = 1, maxIn = trimDim - 1;
    // 1" away from the other perf line
    for (var j = 0; j < positions.length; j++) {
      if (j === idx) continue;
      var otherIn = positions[j] / 100 * trimDim;
      if (inches < otherIn) maxIn = Math.min(maxIn, otherIn - 1);
      else minIn = Math.max(minIn, otherIn + 1);
    }
    var snapped = Math.round(Math.max(minIn, Math.min(maxIn, inches)) * 8) / 8;
    return Math.max(minIn, Math.min(maxIn, snapped));
  }

  // Drag handler for perf lines
  function handlePerfDrag(e) {
    if (draggingPerf === null || !proofContainerRef.current) return;
    var pl = perfLines[draggingPerf];
    if (!pl) return;
    var rect = proofContainerRef.current.getBoundingClientRect();
    var trimDim = pl.vertical ? longEdge : shortEdge;
    var bPct = pl.vertical ? bleedPctX : bleedPctY;
    var trimSpan = 100 - bPct * 2;
    var mouseRel = pl.vertical
      ? ((e.clientX - rect.left) / rect.width * 100)
      : ((e.clientY - rect.top) / rect.height * 100);
    var rawInches = (mouseRel - bPct) / trimSpan * trimDim;
    var clamped = clampPerfInches(rawInches, draggingPerf, trimDim, perfPositions);
    var updated = perfPositions.slice();
    updated[draggingPerf] = Math.round(clamped / trimDim * 1000) / 10;
    onPerfPositions(updated);
  }

  // Commit typed perf value
  function commitPerfEdit(idx) {
    var v = parseFloat(editPerfVal);
    if (isNaN(v)) { setEditingPerf(null); return; }
    var trimDim = perfVertical ? longEdge : shortEdge;
    var clamped = clampPerfInches(v, idx, trimDim, perfPositions);
    var updated = perfPositions.slice();
    updated[idx] = Math.round(clamped / trimDim * 1000) / 10;
    onPerfPositions(updated);
    setEditingPerf(null);
  }

  // Scale order size to match uploaded art dimensions
  function handleMatchSize() {
    if (!effectiveDims || !onSizeOverride) return;
    var artW = effectiveDims.w, artH = effectiveDims.h;
    if (!artW || !artH) return;
    if (!confirm("This will change your brochure size to match the uploaded artwork dimensions. Continue?")) return;
    var input = prompt(
      "Artwork is " + artW.toFixed(2) + "\u2033 \u00d7 " + artH.toFixed(2) + "\u2033.\n\n" +
      "How much of this size is bleed (per side)?\n\n" +
      "Enter 0 if artwork has no bleeds.\n" +
      "Standard print bleed is 0.125\u2033.",
      "0.125"
    );
    if (input === null) return;
    var bleedVal = parseFloat(input);
    if (isNaN(bleedVal) || bleedVal < 0 || bleedVal >= Math.min(artW, artH) / 2) {
      alert("Invalid bleed value.");
      return;
    }
    var trimW = artW - bleedVal * 2;
    var trimH = artH - bleedVal * 2;
    onSizeOverride(trimW, trimH);
  }

  // Panel labels for current fold type + side, respecting flip
  const panelCfg = PANEL_LABELS[foldType];
  const panelLabels = useMemo(() => {
    if (!panelCfg || panels <= 1) return [];
    const labels = [...(side === "front" ? panelCfg.front : panelCfg.back)];
    if (foldFlipped) labels.reverse();
    return labels;
  }, [foldType, panels, side, foldFlipped]);

  return (
    <div>
      {/* Upload area */}
      {!hasArt ? (
        <div
          onDragOver={e => { e.preventDefault(); setDropHover(true); }}
          onDragLeave={() => setDropHover(false)}
          onDrop={e => { e.preventDefault(); setDropHover(false); processFile(e.dataTransfer.files); }}
          onClick={() => fileRef.current?.click()}
          style={{
            padding: mob ? "24px 16px" : "32px 20px", borderRadius: 8,
            border: `2px dashed ${dropHover ? CK.cyan : CC.border}`,
            background: dropHover ? CK.cyanLight : "#fafafa",
            cursor: "pointer", textAlign: "center", transition: "all .15s",
          }}>
          <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.tiff,.tif" onChange={e => processFile(e.target.files)} style={{ display: "none" }} />
          <div style={{ fontSize: 28, marginBottom: 6 }}>📄</div>
          <div style={{ fontSize: 13, fontWeight: 600, color: CC.dark }}>
            {loading ? "Processing..." : "Drop your artwork here or click to upload"}
          </div>
          <div style={{ fontSize: 11, color: CC.light, marginTop: 4 }}>
            PDF (page 1 = front, page 2 = back) or JPG/PNG for front side
          </div>
        </div>
      ) : (
        <div>
          {/* File info + actions */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0" }}>
            <div style={{ fontSize: 12, color: CC.mid }}>
              <strong>{fileName}</strong>
              {frontArt?.dims && <span style={{ color: CC.light, marginLeft: 6 }}>{frontArt.dims.w.toFixed(1)}" × {frontArt.dims.h.toFixed(1)}"</span>}
            </div>
            <button type="button" onClick={handleClear} style={{
              padding: "3px 10px", fontSize: 10, fontWeight: 600, borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
              border: `1px solid ${CC.border}`, background: "#fff", color: CC.light,
            }}>Remove uploads</button>
          </div>

          {/* Proof button + info */}
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <button type="button" onClick={() => setProofOpen(true)} style={{
              padding: "10px 18px", fontSize: 13, fontWeight: 700, borderRadius: 6, cursor: "pointer", fontFamily: "inherit",
              border: "none", display: "flex", alignItems: "center", gap: 6,
              background: approved ? "linear-gradient(135deg, #22c55e 0%, #16a34a 100%)" : "linear-gradient(180deg, #fff 0%, #f7f7f8 100%)",
              color: approved ? "#fff" : "#555", boxShadow: "0 1px 3px rgba(0,0,0,.08)",
              border: `1px solid ${approved ? "#16a34a" : CC.border}`,
            }}>
              {approved ? "✓ Proof Approved" : "🔍 Proof"} {!approved && <span style={{ fontSize: 9, fontWeight: 700, background: "#fee2e2", color: "#dc2626", padding: "1px 6px", borderRadius: 4 }}>required</span>}
            </button>
            <div style={{ fontSize: 11, color: CC.light, lineHeight: 1.4 }}>Open proof to review bleed, trim, safety{panels > 1 ? ", fold lines" : ""} and approve artwork</div>
          </div>

          {/* Fold selection + 3D Preview */}
          <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
            <div style={{ flex: 1 }}>
              <Sel label="Fold Type" value={foldType} onChange={onFoldChange}>
                {FOLD_TYPES.map(f => <option key={f.val} value={f.val}>{f.label}</option>)}
              </Sel>
            </div>
            {panels > 1 && (
              <button type="button" onClick={() => { setPreviewOpen(true); setPreviewAngle(0); }} style={{
                padding: "10px 16px", fontSize: 12, fontWeight: 600, borderRadius: 6, cursor: "pointer", fontFamily: "inherit",
                border: `1px solid ${CC.border}`, background: "linear-gradient(180deg, #fff 0%, #f7f7f8 100%)", color: "#555",
                display: "flex", alignItems: "center", gap: 5, whiteSpace: "nowrap",
              }}>📖 3D Preview</button>
            )}
          </div>
          {panels > 1 && sizeMode === "custom" && (
            <Pil label="Fold Direction" value={foldDir} onChange={onFoldDirChange} options={[
              { t: `Fold Long Side (${longEdge}")`, v: "long" },
              { t: `Fold Short Side (${shortEdge}")`, v: "short" },
            ]} />
          )}
          {panels > 1 && (() => {
            const foldDim2 = foldDir === "long" ? longEdge : shortEdge;
            const staticDim2 = foldDir === "long" ? shortEdge : longEdge;
            const panelSize2 = foldDim2 / panels;
            const tooSmall2 = panelSize2 < 2;
            const throatExceeded2 = foldDir === "short" && longEdge > 13;
            return <>
              <div style={{ marginTop: 8, padding: "8px 12px", background: tooSmall2 || throatExceeded2 ? "#fef2f2" : CK.cyanLight, borderRadius: 5, fontSize: 11, color: tooSmall2 || throatExceeded2 ? "#dc2626" : CC.mid, border: tooSmall2 || throatExceeded2 ? "1px solid #f5cccc" : "none" }}>
                Folded size: <strong>{staticDim2.toFixed(1)}" × {panelSize2.toFixed(1)}"</strong> ({panels} panels)
                {tooSmall2 && <span style={{marginLeft:8,fontWeight:700}}>— Panel too small (min 2")</span>}
                {throatExceeded2 && <span style={{marginLeft:8,fontWeight:700}}>— Exceeds 13" folder throat</span>}
              </div>
              {sizeMode !== "custom" && <p style={{fontSize:10,color:CC.light,margin:"4px 0 0"}}>All folds assume the longest edge is being folded. Use custom size to fold the short edge.</p>}
            </>;
          })()}

          {/* Individual side upload slots */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 8 }}>
            {[{s:"front",label:fLabel,art:frontArt,setArt:setFrontArt,inputRef:frontInputRef},{s:"back",label:bLabel,art:backArt,setArt:setBackArt,inputRef:backInputRef}].map(({s,label,art,setArt,inputRef}) => {
              const handleSlotFile = async (file) => {
                if (!file) return;
                const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(file); });
                if (!dataUrl) return;
                const dims = await new Promise(res => { const img = new Image(); img.onload = () => res({ w: img.naturalWidth / 300, h: img.naturalHeight / 300 }); img.onerror = () => res({ w: 0, h: 0 }); img.src = dataUrl; });
                setArt({ dataUrl, file, dims });
                setApproved(false);
              };
              return (
                <div key={s} style={{ position: "relative" }}>
                  <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".5px", color: CC.mid, marginBottom: 4 }}>
                    {label}
                  </div>
                  {art ? (
                    <div style={{ position: "relative", borderRadius: 6, overflow: "hidden", border: `2px solid ${CC.border}`, cursor: "pointer" }}
                      onClick={() => { setSide(s); setProofOpen(true); }}>
                      <img src={art.dataUrl} style={{ width: "100%", display: "block", aspectRatio: `${longEdge}/${shortEdge}`, objectFit: "cover" }} />
                      <div style={{ position: "absolute", top: 4, right: 4, display: "flex", gap: 3 }}>
                        <button type="button" onClick={e => { e.stopPropagation(); inputRef.current?.click(); }} style={{
                          width: 22, height: 22, borderRadius: 4, border: "none", background: "rgba(0,0,0,.6)", color: "#fff", fontSize: 11, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                        }} title="Replace">↻</button>
                        <button type="button" onClick={e => { e.stopPropagation(); setArt(null); setApproved(false); }} style={{
                          width: 22, height: 22, borderRadius: 4, border: "none", background: "rgba(0,0,0,.6)", color: "#fff", fontSize: 11, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                        }} title="Remove">✕</button>
                      </div>
                    </div>
                  ) : (
                    <div
                      onDragOver={e => e.preventDefault()}
                      onDrop={e => { e.preventDefault(); const f = e.dataTransfer.files?.[0]; if (f) handleSlotFile(f); }}
                      onClick={() => inputRef.current?.click()}
                      style={{
                        aspectRatio: `${longEdge}/${shortEdge}`, borderRadius: 6,
                        border: `2px dashed ${CC.border}`, background: "#fafafa",
                        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                        cursor: "pointer", transition: "all .15s",
                      }}>
                      <div style={{ fontSize: 20, marginBottom: 2 }}>+</div>
                      <div style={{ fontSize: 10, color: CC.light }}>Drop or click</div>
                    </div>
                  )}
                  <input ref={inputRef} type="file" accept=".jpg,.jpeg,.png,.tiff,.tif" onChange={e => { const f = e.target.files?.[0]; if (f) handleSlotFile(f); e.target.value = ""; }} style={{ display: "none" }} />
                </div>
              );
            })}
          </div>

          {/* Approval status */}
          {approved ? (
            <div style={{ marginTop: 8, padding: "6px 12px", background: "#f0fdf4", border: "1px solid #86efac", borderRadius: 5, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: "#166534" }}>✓ Artwork Approved</span>
              <button type="button" onClick={() => setApproved(false)} style={{ fontSize: 10, fontWeight: 600, border: "1px solid #86efac", background: "#fff", color: "#16a34a", borderRadius: 4, padding: "2px 8px", cursor: "pointer", fontFamily: "inherit" }}>Review</button>
            </div>
          ) : (
            <div style={{ marginTop: 8, padding: "6px 12px", background: "#fef2f2", border: "1px solid #f5cccc", borderRadius: 5, fontSize: 11, color: "#dc2626" }}>
              Open the proof view to review and approve your artwork
            </div>
          )}
        </div>
      )}

      {/* Proof Modal */}
      {proofOpen && currentArt && (
        <div style={{ position: "fixed", inset: 0, zIndex: 9999, background: "rgba(0,0,0,.85)", display: "flex", flexDirection: "column" }}>
          {/* Header */}
          <div style={{ padding: "12px 20px", borderBottom: "1px solid rgba(255,255,255,.1)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#fff" }}>Artwork Proof — {side === "front" ? fLabel : bLabel}</div>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,.4)" }}>{longEdge}" × {shortEdge}" flat{panels > 1 ? ` · ${panels} panels (${foldType})` : ""}</div>
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                {canFlip && (
                  <button type="button" onClick={() => setFoldFlipped(f => !f)} style={{
                    padding: "5px 12px", fontSize: 11, fontWeight: 600, border: "1px solid rgba(255,255,255,.2)",
                    borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                    background: foldFlipped ? "#f59e0b" : "rgba(255,255,255,.06)",
                    color: foldFlipped ? "#000" : "rgba(255,255,255,.5)",
                  }}>Flip Fold</button>
                )}
                {backArt && (
                  <div style={{ display: "flex", borderRadius: 4, overflow: "hidden", border: "1px solid rgba(255,255,255,.2)" }}>
                    <button type="button" onClick={() => setSide("front")} style={{ padding: "5px 12px", fontSize: 11, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: side === "front" ? CK.cyan : "rgba(255,255,255,.06)", color: side === "front" ? "#fff" : "rgba(255,255,255,.5)" }}>Front</button>
                    <button type="button" onClick={() => setSide("back")} style={{ padding: "5px 12px", fontSize: 11, fontWeight: 600, border: "none", cursor: "pointer", fontFamily: "inherit", background: side === "back" ? CK.cyan : "rgba(255,255,255,.06)", color: side === "back" ? "#fff" : "rgba(255,255,255,.5)" }}>Back</button>
                  </div>
                )}
                <button type="button" onClick={() => { setApproved(true); setProofOpen(false); }} style={{
                  padding: "5px 14px", fontSize: 11, fontWeight: 700, border: "none", borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                  background: approved ? "linear-gradient(135deg, #22c55e 0%, #16a34a 100%)" : "rgba(255,255,255,.04)",
                  color: approved ? "#fff" : "#ef4444", border: approved ? "none" : "2px solid #ef4444",
                }}>{approved ? "✓ Approved" : "Approve Now"}</button>
                <button type="button" onClick={() => setProofOpen(false)} style={{ background: "none", border: "1px solid rgba(255,255,255,.15)", color: "rgba(255,255,255,.5)", width: 32, height: 32, borderRadius: 8, cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
              </div>
            </div>
            {/* Transform controls */}
            <div style={{ marginTop: 8, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
              <FitToggle />
              {onSizeOverride && effectiveDims && (
                <button type="button" onClick={handleMatchSize} style={{
                  padding: "3px 10px", fontSize: 10, fontWeight: 600, borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
                  border: "1px solid rgba(255,255,255,.2)", background: "rgba(255,255,255,.06)", color: "rgba(255,255,255,.5)",
                }}>↔ Match size to art</button>
              )}
            </div>
          </div>

          {/* Proof view — bleed-inclusive container like saddle stitch */}
          <div style={{ flex: 1, overflow: "auto", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
            <div ref={proofContainerRef} style={{ position: "relative", maxWidth: 800, width: "100%", aspectRatio: `${bleedW}/${bleedH}`, background: "#1a1d23", borderRadius: 4, overflow: "hidden", ...(draggingPerf !== null ? { touchAction: "none" } : {}) }}
              onPointerMove={handlePerfDrag}
              onPointerUp={() => setDraggingPerf(null)}
            >
              {/* Art with transforms — renders in full bleed container */}
              {(() => {
                const ed = effectiveDims;
                const artSrc = rotatedUrl || currentArt.dataUrl;
                const nativeW = ed ? ed.w / bleedW : 1;
                const cropStyle = (mult) => ({
                  width: `${nativeW * mult * 100}%`, height: "auto",
                  position: "absolute", top: "50%", left: "50%",
                  transform: "translate(-50%, -50%)", display: "block",
                });
                const sideColor = side === "front" ? frontColor : backColor;
                const grayFilter = sideColor === "bw" ? "grayscale(1)" : "none";
                return (
                  <div style={{ position: "absolute", inset: 0, overflow: "hidden", background: "#2a2e36" }}>
                    <img src={artSrc} style={{
                      filter: grayFilter,
                      ...(fitMode === "crop" ? cropStyle(1)
                        : fitMode === "scale" ? cropStyle(artScale / 100)
                        : fitMode === "stretch" ? { display: "block", width: "100%", height: "100%", objectFit: "fill", position: "absolute", inset: 0 }
                        : { display: "block", width: "100%", height: "100%", objectFit: fitMode === "contain" ? "contain" : "cover" }
                      )
                    }} />
                  </div>
                );
              })()}

              {/* Bleed guide (red dashed) — at container edge */}
              <div style={{ position: "absolute", inset: 0, border: "2.5px dashed #ef4444", pointerEvents: "none", zIndex: 1, opacity: 0.8 }} />
              {/* Trim guide (white/light dashed) — inset by bleed */}
              <div style={{ position: "absolute", top: `${bleedPctY}%`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, bottom: `${bleedPctY}%`, border: "2.5px dashed #e2e8f0", pointerEvents: "none", zIndex: 1 }} />
              {/* Safety guide (green dashed) — further inset */}
              <div style={{ position: "absolute", top: `${safetyPctY}%`, left: `${safetyPctX}%`, right: `${safetyPctX}%`, bottom: `${safetyPctY}%`, border: "2.5px dashed #38a169", pointerEvents: "none", zIndex: 1 }} />

              {/* Fold lines (orange dashed) */}
              {foldLines.map((fl, i) => (
                <div key={i} style={{
                  position: "absolute", pointerEvents: "none", zIndex: 4,
                  ...(fl.vertical
                    ? { left: `${bleedPctX + (100 - bleedPctX * 2) * fl.pct / 100}%`, top: `${bleedPctY}%`, bottom: `${bleedPctY}%`, width: 2.5, background: "repeating-linear-gradient(to bottom, #f59e0b 0, #f59e0b 6px, transparent 6px, transparent 12px)" }
                    : { top: `${bleedPctY + (100 - bleedPctY * 2) * fl.pct / 100}%`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, height: 2.5, background: "repeating-linear-gradient(to right, #f59e0b 0, #f59e0b 6px, transparent 6px, transparent 12px)" }
                  ),
                }}>
                  <span style={{
                    position: "absolute", fontSize: 9, fontWeight: 700, color: "#f59e0b",
                    background: "rgba(0,0,0,.5)", padding: "1px 4px", borderRadius: 2,
                    ...(fl.vertical ? { top: 8, left: 4 } : { left: 8, top: 2 }),
                  }}>Fold {i + 1}</span>
                </div>
              ))}

              {/* Perf lines (purple dashed, draggable) */}
              {perfLines.map((pl) => {
                const bPct = pl.vertical ? bleedPctX : bleedPctY;
                const pos = bPct + (100 - bPct * 2) * pl.pct / 100;
                const trimDim = pl.vertical ? longEdge : shortEdge;
                const inches = (pl.pct / 100 * trimDim);
                const inchLabel = (Math.round(inches * 8) / 8).toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
                const isDragging = draggingPerf === pl.index;
                const isEditing = editingPerf === pl.index;
                const hitW = mob ? 36 : 20;
                return (
                  <React.Fragment key={"perf" + pl.index}>
                    {/* Visible line */}
                    <div style={{
                      position: "absolute", pointerEvents: "none", zIndex: 5,
                      transition: isDragging ? "none" : "left .1s, top .1s",
                      ...(pl.vertical
                        ? { left: `${pos}%`, top: `${bleedPctY}%`, bottom: `${bleedPctY}%`, width: isDragging ? 3.5 : 2.5, background: "repeating-linear-gradient(to bottom, #8b5cf6 0, #8b5cf6 6px, transparent 6px, transparent 12px)", boxShadow: isDragging ? "0 0 6px rgba(139,92,246,.6)" : "none" }
                        : { top: `${pos}%`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, height: isDragging ? 3.5 : 2.5, background: "repeating-linear-gradient(to right, #8b5cf6 0, #8b5cf6 6px, transparent 6px, transparent 12px)", boxShadow: isDragging ? "0 0 6px rgba(139,92,246,.6)" : "none" }
                      ),
                    }}>
                      {/* Tappable label — click to type a value */}
                      {isEditing ? (
                        <span style={{
                          position: "absolute", zIndex: 8, pointerEvents: "auto",
                          ...(pl.vertical ? { bottom: 8, left: 4 } : { right: 8, top: 2 }),
                        }}>
                          <input type="number" autoFocus step="0.125" min="1" max={trimDim - 1}
                            value={editPerfVal}
                            onChange={(e) => setEditPerfVal(e.target.value)}
                            onBlur={() => commitPerfEdit(pl.index)}
                            onKeyDown={(e) => { if (e.key === "Enter") commitPerfEdit(pl.index); if (e.key === "Escape") setEditingPerf(null); }}
                            style={{
                              width: 52, fontSize: 10, fontWeight: 700, color: "#8b5cf6",
                              background: "rgba(0,0,0,.85)", border: "1px solid #8b5cf6",
                              borderRadius: 3, padding: "2px 4px", outline: "none",
                              textAlign: "center",
                            }}
                          />
                        </span>
                      ) : (
                        <span
                          onClick={() => { setEditingPerf(pl.index); setEditPerfVal(inchLabel); }}
                          style={{
                            position: "absolute", fontSize: 9, fontWeight: 700, color: "#8b5cf6",
                            background: "rgba(0,0,0,.7)", padding: "1px 5px", borderRadius: 2, whiteSpace: "nowrap",
                            cursor: "text", pointerEvents: "auto",
                            ...(pl.vertical ? { bottom: 8, left: 4 } : { right: 8, top: 2 }),
                          }}>Perf {pl.index + 1} · {inchLabel}"</span>
                      )}
                    </div>
                    {/* Touch/mouse hit zone for dragging */}
                    <div
                      style={{
                        position: "absolute", zIndex: 6, touchAction: "none",
                        cursor: pl.vertical ? "col-resize" : "row-resize",
                        ...(pl.vertical
                          ? { left: `calc(${pos}% - ${hitW/2}px)`, top: `${bleedPctY}%`, bottom: `${bleedPctY}%`, width: hitW }
                          : { top: `calc(${pos}% - ${hitW/2}px)`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, height: hitW }
                        ),
                      }}
                      onPointerDown={(e) => { if (editingPerf !== null) return; e.preventDefault(); setDraggingPerf(pl.index); e.target.setPointerCapture(e.pointerId); }}
                    />
                  </React.Fragment>
                );
              })}

              {/* Panel labels */}
              {panelLabels.length > 0 && panelLabels.map((label, i) => {
                const foldingLong = foldDir === "long";
                const trimL = bleedPctX, trimR = 100 - bleedPctX;
                const trimT = bleedPctY, trimB = 100 - bleedPctY;
                const trimW = trimR - trimL, trimH = trimB - trimT;
                // Panel bounds from panelFracs (handles unequal gate fold panels)
                const edges = [0, ...panelFracs, 1];
                const pStart = edges[i], pEnd = edges[i + 1];
                const left = foldingLong ? (trimL + trimW * pStart) : trimL;
                const right = foldingLong ? (100 - trimL - trimW * pEnd) : (100 - trimR);
                const top = foldingLong ? trimT : (trimT + trimH * pStart);
                const bottom = foldingLong ? (100 - trimB) : (100 - trimT - trimH * pEnd);
                return (
                  <div key={"pl" + i} style={{
                    position: "absolute", left: `${left}%`, right: `${right}%`, top: `${top}%`, bottom: `${bottom}%`,
                    display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none", zIndex: 3,
                  }}>
                    <span style={{
                      fontSize: 10, fontWeight: 700, color: "rgba(255,255,255,.85)",
                      background: "rgba(0,0,0,.55)", padding: "2px 8px", borderRadius: 3,
                      whiteSpace: "nowrap", letterSpacing: ".02em",
                    }}>{label}</span>
                  </div>
                );
              })}

              {/* Trim shadow overlay — darkens the bleed zone around the art */}
              <div style={{ position: "absolute", top: `${bleedPctY}%`, left: `${bleedPctX}%`, right: `${bleedPctX}%`, bottom: `${bleedPctY}%`, boxShadow: "0 0 0 200px rgba(0,0,0,0.15)", pointerEvents: "none", zIndex: 0 }} />

              {/* Legend */}
              <div style={{ position: "absolute", bottom: 8, left: 8, display: "flex", gap: 10, fontSize: 9, zIndex: 3, background: "rgba(0,0,0,.6)", padding: "3px 8px", borderRadius: 3 }}>
                <span style={{ color: "#ef4444", fontWeight: 600 }}>— Bleed</span>
                <span style={{ color: "#e2e8f0", fontWeight: 600 }}>- - Trim</span>
                <span style={{ color: "#38a169", fontWeight: 600 }}>- - Safety</span>
                {foldLines.length > 0 && <span style={{ color: "#f59e0b", fontWeight: 600 }}>- - Fold</span>}
                {perfLines.length > 0 && <span style={{ color: "#8b5cf6", fontWeight: 600 }}>- - Perf (drag)</span>}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Preview Modal — matches booklet previewer style */}
      {previewOpen && (

                      color: previewAngle === i ? "#000" : "rgba(255,255,255,.45)",
                      boxShadow: previewAngle === i ? "0 2px 12px rgba(0,174,239,.25)" : "none",
                    }}>{v.label}</button>

                </div>

                <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 10px", overflow: "hidden" }}>
                  <div style={{ width: "100%", maxWidth: 700, margin: "0 auto" }}>
                    <FoldRenderer
                      foldKey={foldKey}
                      frontSrc={frontArt?.dataUrl}

            );

        </div>
      )}
    </div>
  );
}

function Panel({ result, compact }) {

      </div>
      <div style={{ display: "flex", borderBottom: `1px solid ${CC.border}` }}>
        {[["Per Unit", "$" + r.perUnit.toFixed(2)], ["Qty", r.qty.toLocaleString()], ["Days", r.days + " biz"]].map(([l, v], i) => (
          <div key={i} style={{ flex: 1, padding: "11px 8px", textAlign: "center", borderRight: i < 2 ? `1px solid ${CC.border}` : "none" }}>
            <div style={{ fontSize: 9.5, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", color: CC.light, marginBottom: 1 }}>{l}</div>
            <div style={{ fontSize: 14.5, fontWeight: 700, color: CC.dark }}>{v}</div>
          </div>

          </div>
        ))}
      </div>}
    </div>
  );
}

function RichTip({ children, tipKey, title, content, dark }) {
  const tip = tipKey && (window.PPS_CONFIG || {}).tips ? (window.PPS_CONFIG.tips[tipKey] || null) : null;

  const resolvedContent = tip ? tip.content : content;
  const [open, setOpen] = useState(false);

  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h); document.addEventListener("touchstart", h);
    return () => { document.removeEventListener("mousedown", h); document.removeEventListener("touchstart", h); };
  }, [open]);
  useEffect(() => { if (open) document.body.style.overflow = mob ? "hidden" : ""; return () => { document.body.style.overflow = ""; }; }, [open, mob]);
    const blocks = Array.isArray(resolvedContent) ? resolvedContent : [{ type: "text", value: resolvedContent || "" }];

    <span ref={ref} style={{ position: "relative", display: "inline-flex", alignItems: "center" }}>

      </span>

        <div onClick={() => setOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.4)", zIndex: 99999 }} />
        <div style={{ position: "fixed", ...(mob ? { bottom: 0, left: 0, right: 0, borderRadius: "16px 16px 0 0", maxHeight: "80vh" } : { top: "50%", left: "50%", transform: "translate(-50%, -50%)", borderRadius: 12, maxHeight: "80vh", width: "min(420px, 90vw)" }), background: dark ? "#1a1d23" : "#fff", border: `1px solid ${dark ? "rgba(255,255,255,.1)" : "#ddd"}`, boxShadow: "0 16px 48px rgba(0,0,0,.25)", zIndex: 100000, overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
          <div style={{ padding: "14px 18px 10px", borderBottom: `1px solid ${dark ? "rgba(255,255,255,.08)" : "#eee"}`, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, background: dark ? "#1a1d23" : "#fff", zIndex: 1 }}>

          </div>
          <div style={{ padding: "12px 18px 18px" }}>
            {blocks.map((b, i) => {
              if (b.type === "text") return <p key={i} style={{ fontSize: 13, lineHeight: 1.6, color: dark ? "rgba(255,255,255,.7)" : CC.mid, margin: i === 0 ? 0 : "10px 0 0" }}>{b.value}</p>;

              return null;
            })}
          </div>
        </div>
      </>}
    </span>
  );
}
